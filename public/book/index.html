<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10162a">
<title>الفيزياء السادس العلمي 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Sans+Arabic:wght@500;600;700;800&family=Pinyon+Script&display=swap">
<style>
/* Layout: a full-bleed WebGL desk with an open Arabic book; glass reading card floats over the text page, control bar docks at the bottom. */
:root{
  --paper:#fbfaf6;
  --ink:#2c2a27;
  --ink-soft:#6f6a62;
  --rule:rgba(44,42,39,.14);
  --glass:rgba(251,250,246,.86);
  --glass-strong:rgba(251,250,246,.96);
  --accent:#b23f36;      /* red pencil: predict / labels */
  --pos:#d4573b;         /* positive charge */
  --neg:#2f6ad0;         /* negative charge */
  --field:#3d9467;       /* field lines */
  --energy:#e3a21a;      /* stored energy */
  --mag:#7b5cd6;         /* magnetic field */
  --desk:#c7ad88;
  --shadow:0 18px 50px rgba(40,34,26,.18),0 2px 6px rgba(40,34,26,.10);
  --f-display:"Noto Sans Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"Amiri","Times New Roman",serif;
  --f-ui:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#22211f;--ink:#efebe3;--ink-soft:#aaa397;--rule:rgba(239,235,227,.16);
    --glass:rgba(30,30,28,.84);--glass-strong:rgba(34,33,31,.97);
    --accent:#f0857a;--pos:#ff7b5c;--neg:#72a2ff;--field:#6cc797;--energy:#ffc24a;--mag:#a48cf0;--desk:#2a2622;
    --shadow:0 18px 50px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#22211f;--ink:#efebe3;--ink-soft:#aaa397;--rule:rgba(239,235,227,.16);
  --glass:rgba(30,30,28,.84);--glass-strong:rgba(34,33,31,.97);
  --accent:#f0857a;--pos:#ff7b5c;--neg:#72a2ff;--field:#6cc797;--energy:#ffc24a;--mag:#a48cf0;--desk:#2a2622;
  --shadow:0 18px 50px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.dragging{cursor:grabbing}
#gl.pick{cursor:pointer}

/* brand */
.brand{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(18px + env(safe-area-inset-left,0px));
  font:500 12px/1.4 var(--f-ui);color:var(--ink-soft);letter-spacing:.02em;pointer-events:none;
  background:var(--glass);padding:6px 12px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand b{color:var(--ink);font-weight:600}

/* reading card */
#card{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));
  width:min(392px,36vw);max-height:calc(100% - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow:auto;background:var(--glass);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);
  border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);direction:rtl;
  padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;
  transition:opacity .35s ease,transform .35s ease}
#card.swap{opacity:0;transform:translateY(6px)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{font:500 12.5px/1 var(--f-ui);color:var(--ink-soft);background:transparent;border:1px solid var(--rule);
  padding:7px 10px;border-radius:999px;cursor:pointer}
.tab[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible,.bar button:focus-visible,.flap:focus-visible,.lesson:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 11.5px/1.2 var(--f-ui);letter-spacing:.06em;color:var(--accent);display:flex;gap:8px;align-items:center}
.eyebrow .pg{color:var(--ink-soft);font-weight:500;letter-spacing:0}
h2{font:700 25px/1.35 var(--f-display);margin:0;text-wrap:balance}
h2 small{display:block;font:italic 400 15px/1.3 var(--f-body);color:var(--ink-soft);direction:ltr;text-align:right}
.body p{font:400 17.5px/1.85 var(--f-body);margin:0 0 10px}
.body p:last-child{margin-bottom:0}
.def{border-right:3px solid var(--accent);padding:6px 12px 6px 0;font:700 17px/1.8 var(--f-body)}
.note{background:color-mix(in srgb,var(--field) 10%,transparent);border-radius:10px;padding:10px 12px;font:400 15.5px/1.75 var(--f-body)}
.note b{font-family:var(--f-ui);font-size:12px;color:var(--field);display:block;margin-bottom:2px}
.mini{width:100%;border-collapse:collapse;font:400 13px/1.5 var(--f-ui);font-variant-numeric:tabular-nums}
.mini th{font-weight:600;color:var(--ink-soft);text-align:right;border-bottom:1px solid var(--rule);padding:4px 6px}
.mini td{border-bottom:1px solid var(--rule);padding:4px 6px}
.mini td.n{direction:ltr;text-align:left}
.tablewrap{overflow-x:auto}

/* predict */
.q{font:700 19px/1.6 var(--f-body);margin:0}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:9px 11px;border-radius:10px;
  border:1px solid var(--rule);font:400 16.5px/1.6 var(--f-body);background:var(--glass-strong)}
.opt .box{flex:none;width:16px;height:16px;border:1.5px solid var(--ink);border-radius:3px;margin-top:5px;position:relative}
.opt[aria-pressed="true"] .box::after{content:"";position:absolute;inset:2px;background:var(--accent);border-radius:1px}
.opt[aria-pressed="true"]{border-color:var(--accent)}
.opt.right{border-color:var(--field)}
.opt.right .box::after{content:"";position:absolute;inset:2px;background:var(--field)}
.flapwrap{position:relative;border-radius:10px;min-height:96px;perspective:700px}
.answer{background:color-mix(in srgb,var(--energy) 12%,var(--glass-strong));border:1px dashed var(--rule);border-radius:10px;padding:12px 14px;font:400 16px/1.8 var(--f-body)}
.answer b{font-family:var(--f-ui);font-size:12px;letter-spacing:.04em;display:block;margin-bottom:3px}
.answer .ok{color:var(--field)}.answer .no{color:var(--accent)}
.flap{all:unset;box-sizing:border-box;position:absolute;inset:0;border-radius:10px;cursor:pointer;
  background:linear-gradient(170deg,#efe7d6,#e4d9c2);color:#3b342a;border:1px solid rgba(60,50,35,.25);
  display:flex;flex-direction:column;justify-content:center;gap:2px;padding:12px 16px;
  transform-origin:50% 0;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .7s;
  box-shadow:0 6px 14px rgba(40,30,15,.18);backface-visibility:hidden}
.flap .t1{font:700 16px/1.4 var(--f-body)}
.flap .t2{font:400 12.5px/1.4 var(--f-ui);opacity:.75}
.flap::after{content:"";position:absolute;left:10px;bottom:10px;width:26px;height:26px;
  background:linear-gradient(135deg,transparent 50%,rgba(60,50,35,.22) 50%);border-radius:0 0 0 6px}
.flap[disabled]{cursor:not-allowed}
.flap[disabled] .t2{color:#8a2f28;opacity:1}
.flapwrap.open .flap{transform:rotateX(-178deg);opacity:0;pointer-events:none}

/* equation */
.eqbox{direction:ltr;text-align:center;font:italic 400 30px/1.4 var(--f-body);padding:16px 10px;border:1.5px solid var(--ink);border-radius:12px;background:var(--glass-strong);overflow-x:auto}
.eqbox + .eqbox{margin-top:-4px}
.eqbox.sm{font-size:23px;padding:10px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.15}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px 2px}
.fr>span:last-child{padding:2px 4px 0}
.eqbox sub,.eqbox sup{font-size:.6em}
.terms{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font:400 15.5px/1.6 var(--f-body);align-items:baseline}
.terms dt{direction:ltr;font:italic 700 17px/1.4 var(--f-body);color:var(--accent);text-align:left}
.terms dd{margin:0}

/* example */
.exq{font:400 16.5px/1.85 var(--f-body);margin:0;background:var(--glass-strong);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.steps{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.step{font:400 16px/1.8 var(--f-body);padding:8px 12px;border-radius:10px;border:1px solid var(--rule);animation:in .45s ease both}
.step .m{direction:ltr;text-align:left;font:italic 400 18px/1.7 var(--f-body);overflow-x:auto;white-space:nowrap}
.step .m b{font-style:normal;color:var(--accent)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* controls */
.ctl{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-direction:column;gap:5px}
.row label{display:flex;justify-content:space-between;gap:10px;font:500 13.5px/1.3 var(--f-ui)}
.row label output{font:600 13.5px/1.3 var(--f-ui);direction:ltr;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);direction:ltr;height:28px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font:600 13.5px/1 var(--f-ui);padding:10px 14px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);text-align:center}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn.sm{padding:8px 11px;font-size:12.5px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.reads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.read{background:var(--glass-strong);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;min-width:0}
.read span{display:block;font:500 11.5px/1.3 var(--f-ui);color:var(--ink-soft)}
.read strong{display:block;font:600 16px/1.4 var(--f-ui);direction:ltr;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read.wide{grid-column:1/-1}
.meter{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;direction:ltr}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .12s linear}
canvas.plot{width:100%;height:150px;display:block;background:var(--glass-strong);border:1px solid var(--rule);border-radius:10px}
.hint{font:400 13px/1.6 var(--f-ui);color:var(--ink-soft);margin:0}
.capvals{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:6px}
.capvals label{font:500 12px/1.3 var(--f-ui);display:flex;flex-direction:column;gap:3px}
.capvals select{font:500 14px var(--f-ui);padding:6px;border-radius:8px;border:1px solid var(--rule);background:var(--glass-strong);color:var(--ink);direction:ltr}

/* bar */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:2px;direction:rtl;background:var(--glass);border:1px solid var(--rule);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:5px 6px;box-shadow:var(--shadow);
  width:min(620px,calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)))}
.bar button{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.bar button:hover{background:var(--rule)}
.bar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cap{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 8px}
.cap .num{font:600 12px var(--f-ui);color:var(--accent);flex:none}
.cap .txt{font:500 13.5px/1.3 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.dots{display:flex;gap:4px;flex:none;direction:rtl}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--ink);width:14px;border-radius:3px}

/* menu */
#menu{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);direction:rtl;
  width:min(440px,calc(100% - 32px));max-height:min(70%,560px);overflow:auto;background:var(--glass-strong);
  border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:10px}
#menu h3{font:700 15px var(--f-display);margin:6px 8px 8px}
.lesson{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:baseline;width:100%;padding:9px 10px;border-radius:10px;cursor:pointer;font:400 16px/1.5 var(--f-body)}
.lesson:hover{background:var(--rule)}
.lesson .n{font:600 12px var(--f-ui);color:var(--accent);min-width:34px;flex:none;direction:ltr;text-align:right}
.lesson[aria-current="true"]{background:var(--ink);color:var(--paper)}
.lesson[aria-current="true"] .n{color:var(--paper)}

#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;direction:rtl;padding:24px;text-align:center;
  background:radial-gradient(ellipse at 50% 44%,#fbf7ec 0%,#efe6d2 60%,#dccfb4 100%);color:#2c2a27;transition:opacity .8s}
#loader.out{opacity:0;pointer-events:none}
#loader .nm{position:relative;display:inline-block;font:700 clamp(72px,16vw,128px)/1.15 var(--f-display)}
#loader .w{display:inline-block;clip-path:inset(-30% 0 -30% 100%);animation:write 1.1s .2s cubic-bezier(.5,0,.3,1) forwards}
@keyframes write{to{clip-path:inset(-30% 0 -30% 0)}}
#loader .drop{position:absolute;left:-.05em;top:1.02em;width:.17em;height:.17em;border-radius:50%;background:currentColor;color:#d4573b;
  box-shadow:0 0 .1em currentColor,0 0 .35em currentColor;opacity:0;transform:translateY(-1.3em);
  animation:drop .55s 1.35s cubic-bezier(.55,0,1,.45) forwards,concepts 2.4s 1.95s linear infinite}
@keyframes drop{0%{opacity:0;transform:translateY(-1.3em)}20%{opacity:1}78%{transform:translateY(0) scale(1.25,.75)}90%{transform:translateY(-.06em) scale(.92,1.08)}100%{opacity:1;transform:none}}
@keyframes concepts{0%,100%{color:#d4573b}25%{color:#2f6ad0}50%{color:#3d9467}75%{color:#e3a21a}}
#loader .flr{display:block;margin:-.1em auto 0;width:clamp(150px,28vw,260px);height:auto;overflow:visible}
#loader .flr path{fill:none;stroke:#b23f36;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:260;animation:flr .6s 1.3s cubic-bezier(.4,0,.2,1) forwards}
@keyframes flr{to{stroke-dashoffset:0}}
#loader .by,#loader .tt,#loader .st{opacity:0;animation:fade .6s forwards}
#loader .by{margin-top:14px;font:600 12px/1 var(--f-ui);letter-spacing:.2em;color:#b23f36;animation-delay:1.7s}
#loader .tt{margin-top:12px;font:700 clamp(22px,3.4vw,30px)/1.3 var(--f-display);animation-delay:1.85s}
#loader .st{margin-top:6px;font:italic 400 18px/1.4 var(--f-body);color:#5f5a52;animation-delay:2s}
#loader .cred{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:6px;direction:ltr}
#loader .dev{font:500 13px/1 var(--f-ui);letter-spacing:.32em;text-transform:uppercase;color:#8a847a;opacity:0;animation:fade .5s 2.35s forwards}
#loader .sig{font:400 clamp(40px,7vw,60px)/1.25 "Pinyon Script","Snell Roundhand",cursive;color:#2c2a27;padding:0 .15em;clip-path:inset(-30% 100% -30% 0);animation:sign 1.5s 2.55s cubic-bezier(.45,.05,.3,1) forwards}
@keyframes sign{to{clip-path:inset(-30% 0 -30% 0)}}
#loader .ink{width:clamp(140px,22vw,220px);height:2px;background:linear-gradient(90deg,transparent,#b23f36,transparent);transform:scaleX(0);animation:inkline .7s 3.9s ease-out forwards}
@keyframes inkline{to{transform:scaleX(1)}}
#loader .role{font:500 14px/1.5 var(--f-ui);color:#5f5a52;opacity:0;animation:fade .6s 4.05s forwards}
#loader .skip{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;font:500 12px var(--f-ui);color:#8a847a;opacity:0;animation:fade .6s 1.2s forwards}
.credit{margin-top:4px;padding-top:14px;border-top:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;gap:6px;direction:ltr;text-align:center}
.credit .dev{font:500 11px/1 var(--f-ui);letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
.credit .sig{font:400 34px/1.2 "Pinyon Script","Snell Roundhand",cursive;color:var(--ink)}
.credit .role{font:500 12.5px/1.5 var(--f-ui);color:var(--ink-soft)}
.credit .links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}
.credit a{font:500 13px/1 var(--f-ui);color:var(--ink);text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:8px 12px;display:inline-flex;gap:6px;align-items:center;background:var(--glass-strong)}
.credit a:hover{border-color:var(--accent)}
.credit a svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu-credit{margin:10px 8px 4px;font:500 12px/1.5 var(--f-ui);color:var(--ink-soft);direction:ltr;text-align:center}
.menu-credit b{font:400 22px/1 "Pinyon Script",cursive;color:var(--ink);font-weight:400}
@keyframes fade{to{opacity:1}}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--f-ui);padding:6px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--glass-strong)}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.cover-cta{display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:reduce){#loader .w,#loader .drop,#loader .flr path,#loader .by,#loader .tt,#loader .st,#loader .dev,#loader .sig,#loader .ink,#loader .role{animation:none;clip-path:none;opacity:1;stroke-dashoffset:0;transform:none}}
#nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;direction:rtl;font:400 17px/1.8 var(--f-body)}

@media (max-width:760px){
  .brand{display:none}
  #card{top:auto;right:max(10px,env(safe-area-inset-right,0px));left:max(10px,env(safe-area-inset-left,0px));width:auto;
    bottom:calc(66px + env(safe-area-inset-bottom,0px));max-height:46%;padding:12px 14px 14px;border-radius:14px;gap:10px}
  h2{font-size:21px}
  .body p{font-size:16.5px}
  .bar{bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))}
  .dots{display:none}
  .bar button{width:34px;height:34px}
  #menu{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){
  #card,.flap,.step{transition:none;animation:none}
}

/* ---------- end-of-chapter quiz ---------- */
#quiz{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(24,20,16,.52);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);direction:rtl;animation:qzIn .25s ease}
@keyframes qzIn{from{opacity:0}to{opacity:1}}
.qz-panel{width:min(680px,100%);max-height:min(92vh,900px);overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:18px;box-shadow:var(--shadow);padding:20px 22px 18px;outline:none;animation:qzUp .3s cubic-bezier(.2,.8,.2,1)}
@keyframes qzUp{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#quiz,.qz-panel{animation:none}}
.qz-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.qz-eye{font:600 12.5px var(--f-ui);color:var(--accent)}
.qz-title{font:700 22px/1.35 var(--f-display);margin:2px 0 0}
.qz-x{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--rule);flex:none}
.qz-x:hover{background:var(--rule)}.qz-x svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}

function plates(opt={}){const gap=opt.gap||.24,hh=opt.h||.34,dd=opt.d||.44,y0=opt.y0||.05;const g=new THREE.Group();

  const dotsA=[],dotsB=[];const nz=5,ny=4;for(let i=0;i<nz;i++)for(let j=0;j<ny;j++){const z=(-dd/2)+dd*(i+.5)/nz,y=y0+hh*(j+.5)/ny;

  const fm=fieldMat.clone();const arrows=[];for(let i=0;i<3;i++)for(let j=0;j<2;j++){const a=makeArrow(gap-.04,fm);a.rotation.z=Math.PI/2;a.position.set(gap/2-.02,y0+hh*(j+1)/3,(-dd/2)+dd*(i+.5)/3);g.add(a);arrows.push(a)}
  const o={group:g,A,B:Bp,gap,hh,dd,y0,fm,setCharge(f){const n=Math.round(f*dotsA.length);dotsA.forEach((d,i)=>d.visible=i<n);dotsB.forEach((d,i)=>d.visible=i<n);fm.opacity=Math.min(1,f*1.2)*.9;arrows.forEach(a=>a.visible=f>0.02)}};return o}

    g.add(wire([[.13,.06,.18],[.13,.025,.3],[.06,.03,.46]]),wire([[-.13,.06,.18],[-.13,.025,.3],[-.06,.03,.46]]));
    const dm=basic(0x2f9aa0,{transparent:true,opacity:0});const darr=[];for(let i=0;i<3;i++){const a=makeArrow(.12,dm,.004);a.rotation.z=-Math.PI/2;a.position.set(-.06,.12+i*.1,.24);g.add(a);darr.push(a)}
    const tgt=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,Math.PI,0));this.ref={P,mols,slab,disp,dm,tgt};return g},

  read:()=>`<div class="body"><p><b>الربط على التوازي:</b> تكون جميع المتسعات بفرق جهد متساوٍ يساوي فرق جهد البطارية، والشحنة الكلية تساوي المجموع الجبري للشحنات. يزداد مقدار السعة المكافئة، لأن الربط على التوازي يعني زيادة المساحة السطحية المتقابلة لصفيحتي المتسعة المكافئة، فتكون أكبر من أكبر سعة في المجموعة.</p>

  <div class="note"><b>فكّر</b>لماذا نربط المتسعات؟ (a) للحصول على سعة مكافئة كبيرة تخزن شحنة كبيرة بفرق جهد واطئ. (b) لوضع فرق جهد كبير على طرفي مجموعة قد لا تتحمله المتسعة المنفردة.</div>`,
  predict:{q:'ربطنا متسعتين على التوالي. السعة المكافئة للمجموعة تكون:',options:['أكبر من أكبر سعة في المجموعة','أصغر من أصغر سعة في المجموعة','مساوية لمجموع السعتين'],correct:1,

  eq:()=>`<p class="hint">التوازي:</p><div class="eqbox sm">C<sub>eq</sub> = C<sub>1</sub> + C<sub>2</sub> + C<sub>3</sub> + … + C<sub>n</sub></div><p class="hint">التوالي:</p><div class="eqbox sm">${fr('1','C<sub>eq</sub>')} = ${fr('1','C<sub>1</sub>')} + ${fr('1','C<sub>2</sub>')} + … + ${fr('1','C<sub>n</sub>')}</div><div class="eqbox sm">C<sub>eq</sub> = ${fr('C<sub>1</sub> · C<sub>2</sub>','C<sub>1</sub> + C<sub>2</sub>')} <span style="font:400 13px var(--f-ui)">(لمتسعتين فقط)</span></div>`,
  terms:[['Ceq','السعة المكافئة للمجموعة'],['Qtotal','الشحنة الكلية للمجموعة = Ceq × ΔV'],['ΔV','فرق الجهد على طرفي المجموعة']],
  example:{name:'مثال (4) من الكتاب',q:'ثلاث متسعات ذوات الصفيحتين المتوازيتين سعاتها (6μF، 9μF، 18μF) مربوطة على التوالي، شُحنت المجموعة بشحنة كلية (300μC). احسب: السعة المكافئة، والشحنة على كل متسعة، وفرق الجهد الكلي، وفرق الجهد على كل متسعة.',
    steps:[['السعة المكافئة للتوالي:','1/C<sub>eq</sub> = 1/6 + 1/9 + 1/18 = 6/18 = 1/3  ⟹  <b>C<sub>eq</sub> = 3 μF</b>'],['في التوالي الشحنة متساوية:','Q<sub>1</sub> = Q<sub>2</sub> = Q<sub>3</sub> = <b>300 μC</b>'],['فرق الجهد الكلي:','ΔV<sub>total</sub> = Q / C<sub>eq</sub> = 300 / 3 = <b>100 V</b>'],['فرق الجهد على كل متسعة:','ΔV<sub>1</sub> = 300/6 = <b>50 V</b>،  ΔV<sub>2</sub> = 300/9 = <b>(100/3) V</b>،  ΔV<sub>3</sub> = 300/18 = <b>(50/3) V</b>'],['تحقق:','50 + 33.3 + 16.7 = 100 V ✓']]},
  build(){const g=new THREE.Group();this.st={mode:'par',vals:[4,8,12,6],n:4,V:12};this.dyn=new THREE.Group();g.add(this.dyn);

  solve(){const st=this.st;const v=st.vals.slice(0,st.n);let Ceq,Qs,Vs;if(st.mode==='par'){Ceq=v.reduce((a,b)=>a+b,0);Vs=v.map(()=>st.V);Qs=v.map(c=>c*st.V)}else{Ceq=1/v.reduce((a,b)=>a+1/b,0);const Q=Ceq*st.V;Qs=v.map(()=>Q);Vs=v.map(c=>Q/c)}return {v,Ceq,Qs,Vs,Qt:Ceq*st.V}},
  rebuild(){const st=this.st,D=this.dyn;while(D.children.length)D.remove(D.children[0]);this.caps=[];const n=st.n;

      D.add(wire([[.05,.11,.52],[xR,.11,.52],[xR,.11,top]]),wire([[-.05,.11,.52],[xL,.11,.52],[xL,.11,top]]));
      zs.forEach((z,i)=>{const c=this.capAt(0,z,'x');D.add(wire([[xL,.11,z],[-.035,.11,z]]),wire([[.035,.11,z],[xR,.11,z]]));this.caps.push(c)})}
    else{const zs=[];for(let i=0;i<n;i++)zs.push(-.48+i*(.8/Math.max(1,n))+(.8/Math.max(1,n))/2);
      D.add(wire([[.05,.11,.52],[.3,.11,.52],[.3,.11,-.6],[0,.11,-.6],[0,.11,zs[0]-.035]]));
      zs.forEach((z,i)=>{const c=this.capAt(0,z,'z');this.caps.push(c);const nz=i<n-1?zs[i+1]-.035:.4;D.add(wire([[0,.11,z+.035],[0,.11,nz]]))});
      D.add(wire([[0,.11,.4],[-.05,.11,.4],[-.05,.11,.52]]))}
    this.bl.set([`بطارية ΔV = ${st.V} V`])},
  capAt(x,z,axis){const g=new THREE.Group();g.position.set(x,0,z);const pm=plateMat();const a=B(axis==='x'?.012:.12,.13,axis==='x'?.12:.012,pm),b=B(axis==='x'?.012:.12,.13,axis==='x'?.12:.012,pm);
    if(axis==='x'){a.position.x=.025;b.position.x=-.025}else{a.position.z=.025;b.position.z=-.025}a.position.y=b.position.y=.045;
    const ft=B(.14,.01,.14,new THREE.MeshLambertMaterial({color:0xe6e2d8}));g.add(ft,a,b);const gl=glow(0xe3a21a,.22);gl.position.y=.11;g.add(gl);
    const lb=label(300,120,.00082);lb.sprite.position.set(axis==='x'?0:.17,.3,0);g.add(lb.sprite);this.dyn.add(g);return {g,gl,lb}},

  controls(el){const L=this;const r=reads([['c','السعة المكافئة Ceq'],['q','الشحنة الكلية Qtotal'],['rule','القاعدة',true]]);const vals=[1,2,3,4,5,6,8,9,10,12,18,20,30];

    function drawSel(){box.innerHTML='';for(let i=0;i<L.st.n;i++){const s=h('select',{id:'c16_'+i,onchange:e=>{L.st.vals[i]=+e.target.value;upd()}},vals.map(v=>h('option',{value:v,selected:v===L.st.vals[i]},v+' μF')));box.append(h('label',{for:'c16_'+i},`C${i+1}`,s))}}

  update(dt){const st=this.st,R=this.ref;let V=st.V;if(st.drain>0){st.drain-=dt*1.4;V=st.V*Math.max(0,1-(1-st.drain)*3);R.fl.material.opacity=Math.max(0,st.drain);R.fl.scale.setScalar(.8)}else R.fl.material.opacity=0;

LESSONS.push({ch:2,id:'9-2',num:'9-2',title:'قانون فاراداي',en:"Faraday's law",bookPage:61,figure:'ملف يتغير الفيض الذي يخترقه',hint:'اضبط التغير في B والزمن ثم شغّله.',

    const mg=barMagnet(.22,.055);mg.rotation.z=-Math.PI/2;mg.position.set(0,.55,0);g.add(mg);
    const bm=magArrowMat();const inside=[];for(let i=0;i<5;i++){const a=arrowDir(.17,bm,new THREE.Vector3(0,-1,0),.003);const an=i/5*Math.PI*2;a.position.set(Math.cos(an)*.03,.22,Math.sin(an)*.03);g.add(a);inside.push(a)}

LESSONS.push({ch:2,id:'11-2',num:'11-2',title:'التيارات الدوّامة',en:'Eddy currents',bookPage:65,figure:'بندولان يهتزان بين قطبي مغناطيس',hint:'أطلق البندولين وقارن بين الصفيحة الكاملة والمقطعة.',
  pageText:'عندما تواجه صفائح معدنية فيضاً مغناطيسياً متغيراً مع الزمن تنشأ فيها قوة دافعة محتثة وينساب تيار محتث يتخذ مسارات دائرية مقفلة ومتمركزة في مستوى الصفيحة، تسمى التيارات الدوّامة.',
  pageEq:'F B  يعرقل الحركة',
  caption:'صفيحة كاملة وصفيحة مقطعة كأسنان المشط: أيهما يتوقف أولاً؟',tryCap:'أطلق البندولين وراقب أيهما يتوقف بين القطبين.',
  read:()=>`<div class="body"><p>من مضار التيارات الدوامة أنها تتسبب في فقدان طاقة بشكل حرارة في الأجهزة أو في قلب الحديد للملفات. ولتقليلها يُصنع القلب (كما في المحولات) بشكل صفائح من الحديد المطاوع معزولة عن بعضها ومكبوسة كبساً شديداً، فتزداد المقاومة الكهربائية ويقل مقدار التيارات الدوامة.</p>
  <p>عند سحب صفيحة نحاس أفقياً بين قطبي مغناطيس تتولد فيها تيارات دوامة على وفق قانون فاراداي، وبالنتيجة تظهر قوة مغناطيسية F<sub>B</sub> معاكسة للقوة الساحبة، فهي قوة معرقلة للحركة.</p>
  <p><b>تستثمر في:</b> مكابح بعض القطارات الحديثة، إذ تولد ملفات قرب قضبان السكة تيارات دوامة تعرقل الحركة. وكاشفات المعادن في نقاط التفتيش والمطارات (الحث النبضي)، إذ تعرقل التيارات الدوامة في الجسم المعدني التغير في الفيض فيقل التيار المقاس في ملف الاستقبال.</p></div>`,
  predict:{q:'بندولان متماثلان، صفيحة أحدهما كاملة والأخرى مقطعة بشكل أسنان المشط، يهتزان بين قطبي مغناطيس قوي. ماذا يحدث؟',options:['يهتزان بالسعة نفسها','تتوقف الصفيحة الكاملة سريعاً وتستمر المقطعة بتباطؤ قليل','تتوقف المقطعة أولاً'],correct:1,
    why:'تتولد تيارات دوامة كبيرة المقدار في الصفيحة الكاملة عند دخولها المجال وخروجها منه، فتنشأ قوة مغناطيسية تعرقل حركتها وتتلاشى سعة اهتزازها. أما في الصفيحة المقطعة فالتيارات الدوامة صغيرة جداً لأن الشرائح تقطع مساراتها.'},
  eq:()=>`<div class="eqbox sm">ε<sub>ind</sub> = −N ${fr('ΔΦ<sub>B</sub>','Δt')}</div><p class="hint">التيار الدوام يولد قوة F<sub>B</sub> تعاكس المسبب (قانون لنز)، فتتحول طاقة الاهتزاز إلى حرارة في الصفيحة.</p>`,
  terms:[['ΔΦB/Δt','تغير الفيض داخل الصفيحة عند دخولها المجال أو خروجها'],['FB','القوة المعرقلة للحركة'],['شرائح معزولة','تزيد المقاومة فتقل التيارات الدوامة']],
  example:null,
  build(){const g=new THREE.Group();const st={on:true};this.st=st;
    const top=B(.82,.03,.05);top.position.set(0,.56,0);g.add(top);for(const x of[-.4,.4]){const p=Cy(.012,.56,null,10);p.position.set(x,0,0);g.add(p)}
    const mk=(x,slot)=>{const piv=new THREE.Group();piv.position.set(x,.56,0);g.add(piv);const arm=Cy(.005,.38,null,8);arm.rotation.z=Math.PI;piv.add(arm);
      const pl=new THREE.Group();pl.position.y=-.43;piv.add(pl);if(slot){for(let i=0;i<5;i++){const s=B(.016,.1,.006,new THREE.MeshLambertMaterial({color:0xc9cfd6}));s.position.set(-.05+i*.025,-.02,0);pl.add(s)}const bar=B(.13,.02,.006,new THREE.MeshLambertMaterial({color:0xc9cfd6}));bar.position.y=.06;pl.add(bar)}
      else{const s=B(.13,.1,.006,new THREE.MeshLambertMaterial({color:0xc9cfd6}));s.position.y=-.02;pl.add(s)}
      const ed=[];for(const dx of[-.03,.03]){const t=new THREE.Mesh(new THREE.TorusGeometry(.022,.003,6,24),basic(0xe3a21a,{transparent:true,opacity:0}));t.position.set(dx,.03,.006);pl.add(t);ed.push(t)}
      const mN=cbox(.16,.14,.05,magNMat);mN.position.set(x,.13,.06);const mS=cbox(.16,.14,.05,magSMat);mS.position.set(x,.13,-.06);g.add(mN,mS);
      const lb=label(220,60);lb.set([slot?'صفيحة مقطعة':'صفيحة كاملة']);lb.sprite.position.set(x,.68,0);g.add(lb.sprite);return {piv,ed,mags:[mN,mS],th:.9,w:0,slot,amp:.9}};
    this.P=[mk(-.2,false),mk(.2,true)];return g},
  release(){this.P.forEach(p=>{p.th=.9;p.w=0})},
  update(dt){const st=this.st;const n=8;this.P.forEach(p=>{p.mags.forEach(m=>m.visible=st.on);for(let i=0;i<n;i++){const h_=dt/n;const inF=st.on&&Math.abs(p.th)<.32;const c=inF?(p.slot?.6:9):0;const a=-(9.8/.43)*Math.sin(p.th)-c*p.w-.05*p.w;p.w+=a*h_;p.th+=p.w*h_}
      p.piv.rotation.z=p.th;const e=st.on&&Math.abs(p.th)<.32?Math.min(1,Math.abs(p.w)/3)*(p.slot?.2:1):0;p.ed.forEach(t=>t.material.opacity=e);p.amp=Math.max(Math.abs(p.th),p.amp*Math.pow(.999,dt*60))});if(this.sync)this.sync()},
  controls(el){const L=this;const r=reads([['a','زاوية الصفيحة الكاملة'],['b','زاوية الصفيحة المقطعة']]);
    L.sync=()=>{r.set('a',`${(L.P[0].th*57.3).toFixed(0)}°`);r.set('b',`${(L.P[1].th*57.3).toFixed(0)}°`)};
    el.append(h('div',{class:'btns'},h('button',{class:'btn solid',type:'button',onclick:()=>L.release()},'أطلق البندولين'),toggleBtn(L.st.on,'المغناطيس: موجود','المغناطيس: مُزال',v=>{L.st.on=v;L.release()})),r.el,h('p',{class:'hint'},'الحلقات الذهبية على الصفيحة: التيارات الدوامة. أزل المغناطيس لترى أن البندولين يتساويان.'))}
});

LESSONS.push({ch:2,id:'12-2',num:'12-2',title:'المولدات الكهربائية',en:'Electric generators',bookPage:68,figure:'ملف يدور بين قطبي مغناطيس',hint:'بدّل بين حلقتي الزلق والمبادل، وغيّر سرعة الدوران.',
  pageText:'تعمل المولدات الكهربائية على تحويل الطاقة الميكانيكية إلى طاقة كهربائية بتأثير مجال مغناطيسي، وتكون بنوعين: مولد التيار المتناوب (أحادي الطور أو ثلاثي الطور) ومولد التيار المستمر.',
  pageEq:'ε = N B A ω sin (ωt)',
  caption:'ملف يدور في مجال: الفيض يتغير جيبياً فيتولد تيار.',tryCap:'شغّل المولد وبدّل بين حلقتي الزلق (متناوب) والمبادل (مستمر).',
  read:()=>`<div class="body"><p><b>مولد التيار المتناوب أحادي الطور:</b> يربط مع طرفي ملف النواة حلقتان معدنيتان تسميان بحلقتي الزلق وتوصلان مع الدائرة الخارجية بوساطة فرشتين من الكاربون. عند دوران الملف بسرعة زاوية ω منتظمة يكون الفيض Φ<sub>B</sub> = BA cos(ωt)، فتتولد قوة دافعة ε = NBAω sin(ωt) تتغير جيبياً مع الزمن.</p>
  <p>تبلغ مقدارها الأعظم ε<sub>max</sub> = NBAω (ذروة الفولطية المحتثة) بعد ربع دورة، وتنعكس قطبيتها مرتين في الدورة الواحدة. ويكون التيار I = I<sub>max</sub> sin(ωt) حيث I<sub>max</sub> = NBAω/R.</p>
  <p><b>ثلاثي الطور:</b> ثلاثة ملفات تفصل بينها زوايا 120° وتربط نجمياً، ويجهز تياراً متناوباً أكبر.</p>
  <p><b>مولد التيار المستمر:</b> نرفع حلقتي الزلق ونضع حلقة واحدة من نصفين معزولين تسمى المبادل، فيكون التيار في الدائرة الخارجية باتجاه واحد، نبضي الشكل، ومتوسطه I<sub>average</sub> = 0.636 I<sub>max</sub>. ولتقريبه من تيار البطارية نزيد عدد الملفات حول النواة.</p></div>`,
  predict:{q:'في مولد التيار المتناوب أحادي الطور، كم مرة تنعكس قطبية القوة الدافعة المحتثة في الدورة الواحدة؟',options:['مرة واحدة','مرتين','لا تنعكس'],correct:1,
    why:'ε = ε<sub>max</sub> sin(ωt) تمر بالصفر عند ωt = π وعند ωt = 2π، فتنعكس القطبية مرتين في كل دورة كاملة. في مولد التيار المستمر يعكس المبادل اتصال الملف في كل نصف دورة فيبقى التيار الخارجي باتجاه واحد.'},
  eq:()=>`<div class="eqbox sm">Φ<sub>B</sub> = BA cos(ωt)</div><div class="eqbox">ε<sub>ind</sub> = NBAω sin(ωt)</div><div class="eqbox sm">ε<sub>max</sub> = NBAω  ·  ω = 2πf</div><div class="eqbox sm">I<sub>average</sub> = 0.636 I<sub>max</sub></div>`,
  terms:[['ω','السرعة الزاوية (rad/s)'],['f','التردد (Hz)'],['N','عدد لفات الملف'],['A','مساحة اللفة'],['εmax','ذروة الفولطية المحتثة']],
  example:null,
  build(){const g=new THREE.Group();const st={kind:'ac',f:.6,N:100,B:.5,on:true,th:0};this.st=st;const rig=rotorRig(g,'both');rig.setKind('ac');
    const lp=lampObj();lp.g.position.set(0,0,.5);g.add(lp.g);g.add(wire([[-.045,.2,.3],[-.1,.02,.38],[-.03,.02,.5]]),wire([[.045,.2,.3],[.1,.02,.38],[.03,.02,.5]]));
    const lab=label(300,110);lab.sprite.position.set(0,.55,-.1);g.add(lab.sprite);this.ref={rig,lp,lab,he:[]};return g},
  A:.02,
  update(dt){const st=this.st,R=this.ref;R.rig.setKind(st.kind);const w=2*Math.PI*st.f;if(st.on)st.th+=w*dt*1;R.rig.rot.rotation.z=st.th;R.rig.spin.rotation.z=st.th;
    const emax=st.N*st.B*this.A*w;let e=st.on?emax*Math.sin(st.th):0;if(st.kind==='dc')e=Math.abs(e);R.lp.set(Math.abs(e)/Math.max(1e-6,emax)*.9);hist(R.he,emax?e/emax:0);
    R.lab.set([`ε = ${e.toFixed(2)} V`,`εmax = ${emax.toFixed(2)} V`],{dir:'ltr'});if(this.sync)this.sync()},
  controls(el){const L=this;const r=reads([['m','ذروة الفولطية εmax = NBAω'],['w','السرعة الزاوية ω']]);const cv=h('canvas',{class:'plot',width:700,height:260});
    const upd=()=>{const w=2*Math.PI*L.st.f;r.set('m',`${(L.st.N*L.st.B*L.A*w).toFixed(2)} V`);r.set('w',`${w.toFixed(2)} rad/s`)};
    const k=seg([['ac','حلقتا زلق: تيار متناوب'],['dc','مبادل: تيار مستمر']],L.st.kind,v=>{L.st.kind=v});
    const a=slider('f122','التردد f',.2,1.5,.05,L.st.f,v=>`${v.toFixed(2)} Hz`,v=>{L.st.f=v;upd()}),b=slider('n122','عدد اللفات N',20,500,10,L.st.N,v=>`${v}`,v=>{L.st.N=v;upd()}),c=slider('b122','كثافة الفيض B',.1,1,.05,L.st.B,v=>`${v.toFixed(2)} T`,v=>{L.st.B=v;upd()});
    L.sync=()=>series(cv,[{data:L.ref.he,color:CP().acc}],{min:-1.1,max:1.1,yl:'ε / εmax'});
    upd();el.append(k,a.el,b.el,c.el,r.el,cv,h('p',{class:'hint'},'مساحة الملف هنا 0.02 m² قيمة توضيحية. السهم الأحمر على الملف: متجه المساحة.'))}
});

LESSONS.push({ch:2,id:'13-2',num:'13-2',title:'المحركات الكهربائية للتيار المستمر',en:'DC electric motors',bookPage:72,figure:'محرك يدور فتتولد فيه قوة دافعة مضادة',hint:'شغّل المحرك وراقب التيار وهو يتناقص.',
  pageText:'المحرك الكهربائي وسيلة تعمل على تحويل الطاقة الكهربائية إلى طاقة ميكانيكية. يتركب من الأجزاء نفسها التي يتركب منها مولد التيار المستمر، ولكنه يعمل على العكس من عمل المولد.',
  pageEq:'I = (V applied − ε back) / R',
  caption:'المحرك مولد أيضاً: كلما أسرع، قاوم التيار الذي يديره.',tryCap:'شغّل المحرك من السكون وراقب القوة الدافعة المضادة.',
  read:()=>`<div class="body"><p>تزود حلقة موصلة مقفلة تدور في مجال مغناطيسي بتيار من مصدر للفولطية، فتعمل القوى المغناطيسية المؤثرة في الحلقة على تدويرها بتأثير عزم يسمى عزم المزدوج.</p>
  <p><b>القوة الدافعة الكهربائية المضادة:</b> في أثناء دوران نواة المحرك يحصل تغير في الفيض الذي يخترق الملف، فتتولد على طرفيه قوة دافعة محتثة تسمى المضادة لأنها تعاكس المسبب الذي ولدها على وفق قانون لنز.</p>
  <p>يعتمد مقدارها على سرعة دوران النواة، وعدد لفات الملف، ومساحة اللفة، وكثافة الفيض. والفرق بين الفولطية الموضوعة والقوة الدافعة المضادة هو الذي يحدد مقدار التيار في دائرة المحرك.</p></div>`,
  predict:{q:'متى يكون التيار في ملف المحرك أكبر ما يمكن؟',options:['لحظة بدء التشغيل والمحرك ساكن','عندما يدور بأقصى سرعة','لا يتغير التيار مع السرعة'],correct:0,
    why:'لحظة البدء لا يدور الملف، فلا تتولد قوة دافعة مضادة، ويكون I = V/R أكبر ما يمكن. ومع ازدياد السرعة تزداد ε<sub>back</sub> فيقل الفرق V − ε<sub>back</sub> ويقل التيار.'},
  eq:()=>`<div class="eqbox sm">ε<sub>back</sub> = −N ${fr('ΔΦ<sub>B</sub>','Δt')}</div><div class="eqbox">I = ${fr('V<sub>applied</sub> − ε<sub>back</sub>','R')}</div>`,
  terms:[['Vapplied','الفولطية المستمرة المسلطة على المحرك'],['εback','القوة الدافعة الكهربائية المحتثة المضادة'],['R','مقاومة ملف المحرك']],
  example:null,
  build(){const g=new THREE.Group();const st={V:12,on:false,w:0,th:0};this.st=st;const rig=rotorRig(g,'dc');rig.setKind('dc');
    const bat=B(.16,.07,.08,new THREE.MeshLambertMaterial({color:0xe8e6e0}));bat.position.set(0,0,.5);g.add(bat);g.add(wire([[-.045,.2,.3],[-.1,.02,.38],[-.06,.04,.5]]),wire([[.045,.2,.3],[.1,.02,.38],[.06,.04,.5]]));
    const bl=label(200,60);bl.set(['بطارية']);bl.sprite.position.set(0,.15,.55);g.add(bl.sprite);const lab=label(320,110);lab.sprite.position.set(0,.55,-.1);g.add(lab.sprite);this.ref={rig,lab,hi:[],he:[]};return g},
  k:.12,R:2,J:.02,b:.002,
  update(dt){const st=this.st,R=this.ref;const n=4;let I=0;for(let i=0;i<n;i++){const h_=dt/n;I=st.on?(st.V-this.k*st.w)/this.R:0;st.w+=((this.k*I)-this.b*st.w)/this.J*h_*(st.on?1:1);if(!st.on)st.w*=Math.pow(.6,h_)}
    st.th+=st.w*dt*.06;R.rig.rot.rotation.z=st.th;R.rig.spin.rotation.z=st.th;const eb=this.k*st.w;R.I=I;R.eb=eb;hist(R.hi,I);hist(R.he,eb);
    R.lab.set([`I = ${I.toFixed(2)} A`,`εback = ${eb.toFixed(2)} V`],{dir:'ltr'});if(this.sync)this.sync()},
  controls(el){const L=this;const r=reads([['i','التيار I'],['e','القوة الدافعة المضادة εback'],['s','سرعة الدوران',true]]);const cv=h('canvas',{class:'plot',width:700,height:260});
    const b=h('button',{class:'btn solid',type:'button',onclick:()=>{L.st.on=true;L.st.w=0;L.ref.hi.length=0;L.ref.he.length=0}},'شغّل المحرك من السكون'),o=h('button',{class:'btn',type:'button',onclick:()=>{L.st.on=false}},'افصل البطارية');
    const s=slider('v132','الفولطية المسلطة',3,24,1,L.st.V,v=>`${v} V`,v=>{L.st.V=v});
    L.sync=()=>{r.set('i',`${L.ref.I.toFixed(2)} A`);r.set('e',`${L.ref.eb.toFixed(2)} V`);r.set('s',`${(L.st.w/(2*Math.PI)).toFixed(1)} دورة/ثانية`);const c=CP();series(cv,[{data:L.ref.hi,color:c.acc,name:'I'},{data:L.ref.he.map(v=>v/2),color:c.mag,name:'εback ÷ 2'}],{min:0,max:Math.max(6,L.st.V/2+.5),legend:true})};
    el.append(h('div',{class:'btns'},b,o),s.el,r.el,cv,h('p',{class:'hint'},'مقاومة الملف 2 Ω قيمة توضيحية. السرعة المرسومة مبطّأة.'))}

LESSONS.push({ch:2,id:'14-2',num:'14-2 · 15-2',title:'المحاثة والحث الذاتي',en:'Inductance · Self inductance',bookPage:73,figure:'مصباحان: أحدهما مع ملف والآخر مع مقاومة',hint:'أغلق المفتاح وقارن بين توهج المصباحين.',
  pageText:'التغير في التيار المنساب في الملف يتسبب في حصول تغير في الفيض المغناطيسي خلاله، وهذا التغير يولد قوة دافعة كهربائية محتثة في الملف تعاكس ذلك التغير، تسمى قوة دافعة كهربائية محتثة ذاتية.',
  pageEq:'ε ind = − L ΔI / Δt',
  caption:'مصباحان متماثلان، أحدهما يتأخر: لماذا؟',tryCap:'أغلق المفتاح ثم افتحه، وجرّب إزالة القلب الحديدي.',
  read:()=>`<div class="body"><p>في الدائرة مصباحان متماثلان مربوطان على التوازي مع بطارية: أحدهما مع مقاومة متغيرة R مساوية لمقاومة الملف، والآخر مع ملف L في جوفه قلب من الحديد المطاوع. بعد إغلاق المفتاح بمدة يتوهج المصباحان توهجاً متساوياً، ولكن هنالك تأخر ملحوظ في توهج المصباح المربوط مع الملف. هذا التباطؤ يعزى إلى صفة الملف التي تسمى <b>تأثير المحاثة</b>، ومثل هذا الملف يسمى بالمحث.</p>
  <p><b>الحث الذاتي:</b> عملية تولد قوة دافعة كهربائية محتثة في ملف نتيجة تغير مقدار التيار المنساب لوحدة الزمن في الملف نفسه.</p>

LESSONS.push({ch:3,id:'3-3',num:'3-3 · 4-3 · 5-3',title:'المقاومة الصرف والقدرة والمقدار المؤثر',en:'Pure resistance · Effective current',bookPage:95,figure:'مقاومة صرف في دائرة تيار متناوب',hint:'بدّل بين التيار المتناوب والتيار المستمر المكافئ وقارن الحرارة.',

  read:()=>`<div class="body"><p><b>3-3:</b> إذا ربطنا مقاومة صرف R بين قطبي مصدر للفولطية المتناوبة (رمزه ~) فإن V<sub>R</sub> = V<sub>m</sub> sin(ωt) و I<sub>R</sub> = I<sub>m</sub> sin(ωt): يتغيران بطور واحد (Φ = 0).</p>

  eq:()=>`<div class="eqbox sm">P = I<sub>R</sub>V<sub>R</sub>  ·  P<sub>av</sub> = ${fr('I<sub>m</sub>V<sub>m</sub>','2')} = ½ I<sub>m</sub><sup>2</sup>R</div><div class="eqbox">I<sub>eff</sub> = ${fr('I<sub>m</sub>','√2')} = 0.707 I<sub>m</sub></div><div class="eqbox sm">V<sub>eff</sub> = ${fr('V<sub>m</sub>','√2')} = 0.707 V<sub>m</sub></div>`,

  example:{name:'مثال (1) من الكتاب',q:'مصدر للفولطية المتناوبة ربط بين طرفيه مقاومة صرف R = 100Ω، والفولطية في الدائرة V<sub>R</sub> = 424.2 sin(ωt). احسب: المقدار المؤثر للفولطية، والمقدار المؤثر للتيار، والقدرة المتوسطة.',
    steps:[['من العلاقة:','V<sub>m</sub> = 424.2 V'],['المقدار المؤثر للفولطية:','V<sub>eff</sub> = V<sub>m</sub>/√2 = 424.2/1.414 = <b>300 V</b>'],['المقدار المؤثر للتيار:','I<sub>eff</sub> = V<sub>eff</sub>/R = 300/100 = <b>3 A</b>'],['القدرة المتوسطة:','P<sub>av</sub> = I<sub>eff</sub><sup>2</sup>R = (3)<sup>2</sup> × 100 = <b>900 W</b>  (أو I<sub>eff</sub> × V<sub>eff</sub> = 3 × 300)']]},
  build(){const g=new THREE.Group();const st={Vm:424.2,R:100,dc:false,th:0};this.st=st;const y=.012;

    const a=slider('v33','المقدار الأعظم للفولطية Vm',50,600,.1,L.st.Vm,v=>`${v.toFixed(1)} V`,v=>{L.st.Vm=v;upd()}),b=slider('r33','المقاومة R',25,400,5,L.st.R,v=>`${v} Ω`,v=>{L.st.R=v;upd()});

LESSONS.push({ch:3,id:'6-3',num:'6-3',title:'دائرة تيار متناوب الحمل فيها محث صرف',en:'Pure inductor in an ac circuit',bookPage:100,figure:'محث صرف وأميتر ومصدر متغير التردد',hint:'زد التردد أو أدخل القلب الحديدي وراقب الأميتر.',
  pageText:'في دائرة تيار متناوب تحتوي محثاً صرفاً (ملف مهمل المقاومة) تتقدم الفولطية على التيار بفرق طور 90°. ويُظهر المحث معاكسة للتغير في التيار تسمى رادة الحث، وتتناسب طردياً مع التردد ومع معامل الحث الذاتي.',
  pageEq:'XL = ωL = 2πfL',
  caption:'المحث يعاكس التغير: كلما زاد التردد قل التيار.',tryCap:'زد التردد أو معامل الحث، وراقب الأميتر وفرق الطور.',
  read:()=>`<div class="body"><p>الفولطية عبر المحث V<sub>L</sub> = V<sub>m</sub> sin(ωt + π/2)، والتيار I<sub>L</sub> = I<sub>m</sub> sin(ωt). أي أن متجه الطور للفولطية يتقدم على متجه الطور للتيار بفرق طور Φ = π/2 = 90°.</p>
  <p>يُظهر المحث معاكسة للتغير في التيار تسمى <b>رادة الحث</b> X<sub>L</sub>، وتعتمد على معامل الحث الذاتي L (X<sub>L</sub> ∝ L بثبوت التردد) والتردد الزاوي ω (X<sub>L</sub> ∝ f بثبوت L)، وتقاس بوحدة ohm.</p>
  <p><b>نشاطا الكتاب:</b> عند زيادة تردد المذبذب الكهربائي مع ثبوت الفولطية تقل قراءة الأميتر. وعند إدخال قلب الحديد في جوف الملف تقل القراءة أيضاً، لأنه يزيد معامل الحث الذاتي. وتفسير ذلك على وفق قانون لنز: ازدياد التردد يعني ازدياد ΔI/Δt فتزداد القوة الدافعة المحتثة التي تعرقل التغير.</p>
  <p><b>القدرة:</b> منحني القدرة جيبي تردده ضعف تردد التيار، وأجزاؤه الموجبة والسالبة متساوية بالمساحة، فالقدرة المتوسطة صفر: تخزن الطاقة في المجال المغناطيسي في ربع دورة وتعاد إلى المصدر في الربع الذي يليه.</p></div>
  <div class="note"><b>تذكّر</b>عند الترددات الواطئة جداً تقل X<sub>L</sub> وقد تصل إلى الصفر فيعمل الملف عمل مقاومة صرف. وعند الترددات العالية جداً تزداد X<sub>L</sub> إلى مقدار كبير جداً قد يؤدي إلى قطع التيار، فيعمل الملف عمل مفتاح مفتوح.</div>`,
  predict:{q:'في دائرة فيها محث صرف، زدنا تردد المصدر مع بقاء فولطيته ثابتة. ماذا يحدث لقراءة الأميتر؟',options:['تزداد','تقل','لا تتغير'],correct:1,
    why:'X<sub>L</sub> = 2πfL تزداد بازدياد التردد، والتيار I = V/X<sub>L</sub> يقل. فيزيائياً: التغير الأسرع في التيار يولد قوة دافعة محتثة أكبر تعرقل التيار.'},
  eq:()=>`<div class="eqbox sm">V<sub>L</sub> = V<sub>m</sub> sin(ωt + π/2)  ·  I<sub>L</sub> = I<sub>m</sub> sin(ωt)</div><div class="eqbox">X<sub>L</sub> = ωL = 2πfL</div><div class="eqbox sm">I = ${fr('V<sub>L</sub>','X<sub>L</sub>')}  ·  P<sub>av</sub> = 0</div>`,

LESSONS.push({ch:3,id:'7-3',num:'7-3',title:'دائرة تيار متناوب الحمل فيها متسعة ذات سعة صرف',en:'Pure capacitor in an ac circuit',bookPage:105,figure:'متسعة وأميتر ومصدر متغير التردد',hint:'زد التردد أو السعة وراقب الأميتر.',
  pageText:'في دائرة تيار متناوب تحتوي متسعة ذات سعة صرف يتقدم متجه الطور للتيار على متجه الطور للفولطية بزاوية فرق طور 90°. والمعاكسة التي تبديها المتسعة للتغير في فولطية الدائرة تسمى رادة السعة.',
  pageEq:'XC = 1 / (2πfC)',
  caption:'المتسعة عكس المحث: كلما زاد التردد زاد التيار.',tryCap:'زد التردد أو السعة، وراقب الأميتر وفرق الطور.',
  read:()=>`<div class="body"><p>فرق الجهد عبر المتسعة V<sub>C</sub> = V<sub>m</sub> sin(ωt)، ومن Q = CV<sub>C</sub> و I = ΔQ/Δt نحصل على I<sub>C</sub> = ωCV<sub>m</sub> sin(ωt + π/2). أي أن متجه الطور للتيار يتقدم على متجه الطور للفولطية بزاوية π/2 (ربع دورة).</p>
  <p>مقلوب (ωC) يسمى <b>رادة السعة</b> X<sub>C</sub>، وتعرف بأنها المعاكسة التي تبديها المتسعة للتغير في فولطية الدائرة، وتقاس بوحدة ohm.</p>
  <p><b>نشاطا الكتاب:</b> بزيادة تردد المذبذب مع ثبوت فرق الجهد تزداد قراءة الأميتر (X<sub>C</sub> ∝ 1/f). وبزيادة السعة بإدخال لوح عازل تزداد القراءة أيضاً (X<sub>C</sub> ∝ 1/C).</p>
  <p><b>القدرة:</b> تشحن المتسعة خلال الربع الأول ثم تفرغ جميع شحنتها إلى المصدر في الربع الذي يليه، فالقدرة المتوسطة صفر: المتسعة ذات السعة الصرف لا تبدد قدرة.</p></div>
  <div class="note"><b>تذكّر</b>عند الترددات العالية جداً تقل X<sub>C</sub> وقد تصل إلى الصفر، فتعمل المتسعة عمل مفتاح مغلق. وعند الترددات الواطئة جداً تزداد X<sub>C</sub> إلى مقدار كبير جداً قد يقطع التيار، فتعمل عمل مفتاح مفتوح، كما يحصل في دائرة التيار المستمر.</div>`,
  predict:{q:'في دائرة فيها متسعة ذات سعة صرف، زدنا تردد المصدر مع ثبوت فرق الجهد. ماذا يحدث لقراءة الأميتر؟',options:['تزداد','تقل','لا تتغير'],correct:0,
    why:'X<sub>C</sub> = 1/(2πfC) تتناسب عكسياً مع التردد، فتقل بزيادته ويزداد التيار I = V/X<sub>C</sub>. وهذا عكس سلوك المحث تماماً.'},
  eq:()=>`<div class="eqbox sm">V<sub>C</sub> = V<sub>m</sub> sin(ωt)  ·  I<sub>C</sub> = I<sub>m</sub> sin(ωt + π/2)</div><div class="eqbox">X<sub>C</sub> = ${fr('1','ωC')} = ${fr('1','2πfC')}</div><div class="eqbox sm">I<sub>m</sub> = ${fr('V<sub>m</sub>','X<sub>C</sub>')}  ·  P<sub>av</sub> = 0</div>`,
  terms:[['XC','رادة السعة (ohm)'],['C','سعة المتسعة (F)'],['f','تردد المصدر (Hz)'],['Φ = −90°','الفولطية تتأخر عن التيار']],
  example:{name:'مثال (3) من الكتاب',q:'ربطت متسعة سعتها (4/π μF) بين قطبي مصدر للفولطية المتناوبة فرق الجهد بين طرفيه 2.5V. احسب رادة السعة والتيار إذا كان تردد الدائرة: (a) 5Hz، (b) 5×10⁵Hz.',
    steps:[['(a) عند 5Hz:','X<sub>C</sub> = 1/(2π × 5 × (4/π) × 10<sup>−6</sup>) = 10<sup>6</sup>/40 = <b>25×10<sup>3</sup> Ω</b>'],['التيار:','I = 2.5/(25×10<sup>3</sup>) = <b>1×10<sup>−4</sup> A</b>'],['(b) عند 5×10<sup>5</sup>Hz:','X<sub>C</sub> = 1/(2π × 5×10<sup>5</sup> × (4/π) × 10<sup>−6</sup>) = 1/4 = <b>0.25 Ω</b>'],['التيار:','I = 2.5/0.25 = <b>10 A</b>'],['الاستنتاج:','عند التردد العالي تكاد المتسعة تعمل عمل مفتاح مغلق']]},
  build(){const g=new THREE.Group();const st={lf:.7,C:4/Math.PI,th:0};this.st=st;this.ref=reactRig(g,'C');return g},
  calc(){const s=this.st;const f=Math.pow(10,s.lf);const X=1/(2*Math.PI*f*s.C*1e-6);return {f,X,I:2.5/X}},
  update(dt){const st=this.st,R=this.ref;st.th+=2*Math.PI*.3*dt;const c=this.calc();const n=Math.min(1,c.I/10);R.fl.set(R.path,Math.sin(st.th+Math.PI/2)*.6*Math.max(.05,n),dt);

  controls(el){const L=this;const r=reads([['f','التردد f'],['x','رادة السعة XC'],['i','التيار I (V = 2.5 V)',true]]);
    const upd=()=>{const c=L.calc();r.set('f',`${fmtN(c.f,1)} Hz`);r.set('x',`${fmtN(c.X,2)} Ω`);r.set('i',`${fmtN(c.I,5)} A`)};
    const a=slider('f73','تردد المصدر (مقياس لوغاريتمي)',0,6,.05,L.st.lf,v=>`${fmtN(Math.pow(10,v),1)} Hz`,v=>{L.st.lf=v;upd()}),b=slider('c73','سعة المتسعة C',.2,10,.0001,L.st.C,v=>`${v.toFixed(2)} μF`,v=>{L.st.C=v;upd()});

});

function seriesRig(g){const y=.012;const src=acSource();src.position.set(-.33,0,.42);g.add(src);
  const R=resistorObj();R.position.set(-.18,.012,.2);const L=coilObj(false);L.position.set(.02,.012,.2);const C=capObj();C.position.set(.22,.012,.2);g.add(R,L,C);
  g.add(wire([[-.28,y,.42],[.36,y,.42],[.36,y,.2],[.25,y,.2]]),wire([[.19,y,.2],[.09,y,.2]]),wire([[-.05,y,.2],[-.12,y,.2]]),wire([[-.24,y,.2],[-.4,y,.2],[-.4,y,.42],[-.38,y,.42]]));
  const tags=[R,L,C].map(o=>{const t=tagLabel(200);t.sprite.position.set(o.position.x,.17,o.position.z);g.add(t.sprite);return t});
  const S=scope(.66,.36);S.g.position.set(0,0,-.22);g.add(S.g);const fl=flow(g,14);const path=poly([[-.28,y,.42],[.36,y,.42],[.36,y,.2],[-.4,y,.2],[-.4,y,.42],[-.38,y,.42]]);return {R,tags,S,fl,path}}
function rlc(s){const X=s.XL-s.XC;const Z=Math.hypot(s.R,X);const I=s.V/Z;const phi=Math.atan2(X,s.R);return {X,Z,I,VR:I*s.R,VL:I*s.XL,VC:I*s.XC,phi,pf:Math.cos(phi),Preal:I*I*s.R,Papp:I*s.V}}
function drawSeriesPhasor(S,c,V,th){scBg(S);const W=S.W,H=S.H;const m=Math.max(c.VR,c.VL,c.VC,V)||1;const sc=H*.4/m;const ox=W*.18,oy=H*.52;
  S.x.strokeStyle=SC.axis;S.x.lineWidth=2;S.x.beginPath();S.x.moveTo(ox-20,oy);S.x.lineTo(W*.62,oy);S.x.moveTo(ox,H*.06);S.x.lineTo(ox,H*.96);S.x.stroke();
  scArrow(S,ox,oy,c.VR*sc,0,SC.V,5,'VR');scArrow(S,ox,oy,0,c.VL*sc,SC.L,5,'VL');scArrow(S,ox,oy,0,-c.VC*sc,SC.C,5,'VC');
  S.x.setLineDash([8,6]);scArrow(S,ox+c.VR*sc,oy,0,(c.VL-c.VC)*sc,SC.txt,3,'VL−VC');S.x.setLineDash([]);scArrow(S,ox,oy,c.VR*sc,(c.VL-c.VC)*sc,SC.T,6,'VT');
  scText(S,'I →',W*.56,oy+30,SC.I,24);scText(S,`Φ = ${(c.phi*RAD).toFixed(1)}°`,W-16,36,SC.txt,26,'right');
  const nat=Math.abs(c.X)<1e-6?'Z = R':c.X>0?'inductive':'capacitive';scText(S,nat,W-16,70,SC.txt,24,'right');scText(S,`Z = ${fmtN(c.Z,1)} Ω`,W-16,H-20,SC.txt,26,'right');S.tex.needsUpdate=true}

LESSONS.push({ch:3,id:'8-3',num:'8-3',title:'دائرة تيار متناوب متوالية الربط (R-L-C)',en:'Series R-L-C circuit',bookPage:109,figure:'مقاومة ومحث ومتسعة على التوالي',hint:'غيّر رادة الحث ورادة السعة وراقب مخطط المتجهات الطورية.',

  pageEq:'Z² = R² + (XL − XC)²',
  caption:'ثلاث فولطيات بثلاثة اتجاهات: جمعها اتجاهي لا جبري.',tryCap:'غيّر R وXL وXC وراقب المحصلة VT وزاوية فرق الطور.',
  read:()=>`<div class="body"><p>نتخذ المحور الأفقي X محور إسناد للتيار. خلال المقاومة الصرف: V<sub>R</sub> و I بطور واحد. خلال المتسعة: V<sub>C</sub> يتخلف عن التيار بـ 90° (Φ = −π/2). خلال المحث: V<sub>L</sub> يتقدم على التيار بـ 90° (Φ = +π/2).</p>
  <p>محصلة الفولطيات V<sub>T</sub>: (V<sub>T</sub>)² = (V<sub>R</sub>)² + (V<sub>L</sub> − V<sub>C</sub>)²، و tanΦ = (V<sub>L</sub> − V<sub>C</sub>)/V<sub>R</sub>. والممانعة الكلية Z = V<sub>T</sub>/I هي المعاكسة المشتركة للمقاومة والرادة.</p></div>
  <div class="tablewrap"><table class="mini"><tr><th>الحالة</th><th>خواص الدائرة</th><th>Φ</th></tr><tr><td>V<sub>L</sub> &gt; V<sub>C</sub></td><td>حثية</td><td>موجبة</td></tr><tr><td>V<sub>L</sub> &lt; V<sub>C</sub></td><td>سعوية</td><td>سالبة</td></tr><tr><td>V<sub>L</sub> = V<sub>C</sub></td><td>مقاومة صرف (أومية): حالة الرنين</td><td>صفر</td></tr></table></div>`,
  predict:{q:'في دائرة R-L-C متوالية كانت V<sub>L</sub> أكبر من V<sub>C</sub>. ما خواص الدائرة؟',options:['حثية، والفولطية الكلية تتقدم على التيار','سعوية، والفولطية الكلية تتأخر عن التيار','أومية، والفولطية والتيار بطور واحد'],correct:0,
    why:'عندما V<sub>L</sub> &gt; V<sub>C</sub> تكون المركبة الشاقولية (V<sub>L</sub> − V<sub>C</sub>) موجبة، فتكون زاوية فرق الطور Φ موجبة ويتقدم متجه الطور للفولطية الكلية على متجه الطور للتيار: خواص حثية.'},
  eq:()=>`<div class="eqbox sm">(V<sub>T</sub>)<sup>2</sup> = (V<sub>R</sub>)<sup>2</sup> + (V<sub>L</sub> − V<sub>C</sub>)<sup>2</sup></div><div class="eqbox sm">tanΦ = ${fr('V<sub>L</sub> − V<sub>C</sub>','V<sub>R</sub>')} = ${fr('X<sub>L</sub> − X<sub>C</sub>','R')}</div><div class="eqbox">Z = ${fr('V<sub>T</sub>','I')}  ·  Z<sup>2</sup> = R<sup>2</sup> + (X<sub>L</sub> − X<sub>C</sub>)<sup>2</sup></div>`,
  terms:[['Z','الممانعة الكلية (Ω)'],['X','الرادة = XL − XC'],['VT','الفولطية الكلية (المحصلة)'],['Φ','زاوية فرق الطور بين VT والتيار']],
  example:{name:'مثال (4) من الكتاب',q:'ربط ملف معامل حثه الذاتي L = √3/π mH بين قطبي مصدر للفولطية المتناوبة فرق جهده 100V، فكانت زاوية فرق الطور بين متجه الطور للفولطية الكلية ومتجه الطور للتيار 60° ومقدار التيار 10A. ما مقدار مقاومة الملف، وتردد المصدر؟',
    steps:[['الممانعة الكلية:','Z = V<sub>T</sub>/I = 100/10 = 10 Ω'],['من مثلث الممانعة:','cosΦ = R/Z  ⟹  cos60° = R/10  ⟹  <b>R = 5 Ω</b>'],['رادة الحث:','Z<sup>2</sup> = R<sup>2</sup> + X<sub>L</sub><sup>2</sup>  ⟹  100 = 25 + X<sub>L</sub><sup>2</sup>  ⟹  X<sub>L</sub> = 5√3 Ω'],['التردد:','5√3 = 2πf × (√3/π) × 10<sup>−3</sup>  ⟹  <b>f = 2500 Hz</b>']]},
  build(){const g=new THREE.Group();const st={R:40,XL:120,XC:90,V:200,th:0};this.st=st;this.ref=seriesRig(g);return g},
  update(dt){const st=this.st,R=this.ref;st.th+=dt;const c=rlc(st);R.tags[0].set([`VR = ${c.VR.toFixed(0)} V`],{dir:'ltr'});R.tags[1].set([`VL = ${c.VL.toFixed(0)} V`],{dir:'ltr'});R.tags[2].set([`VC = ${c.VC.toFixed(0)} V`],{dir:'ltr'});
    R.R.userData.heat.material.opacity=Math.min(.9,c.Preal/900);R.fl.set(R.path,Math.sin(st.th*2)*.5*Math.min(1,c.I/5),dt);drawSeriesPhasor(R.S,c,st.V,st.th)},
  controls(el){const L=this;const r=reads([['z','الممانعة Z'],['i','التيار I'],['p','زاوية فرق الطور Φ'],['n','خواص الدائرة']]);
    const upd=()=>{const c=rlc(L.st);r.set('z',`${c.Z.toFixed(1)} Ω`);r.set('i',`${c.I.toFixed(2)} A`);r.set('p',`${(c.phi*RAD).toFixed(1)}°`);r.set('n',Math.abs(c.X)<.5?'مقاومة صرف (رنين)':c.X>0?'حثية':'سعوية')};

    upd();el.append(a.el,b.el,c.el,d.el,r.el,h('p',{class:'hint'},'على الشاشة: مخطط المتجهات الطورية للفولطيات. اجعل XL = XC لترى حالة الرنين.'))}
});

LESSONS.push({ch:3,id:'9-3',num:'9-3',title:'عامل القدرة',en:'Power factor',bookPage:113,figure:'القدرة الحقيقية والقدرة الظاهرية',hint:'غيّر الرادات وقارن عمودي القدرة الحقيقية والظاهرية.',
  pageText:'تستهلك القدرة في دوائر التيار المتناوب في المقاومة فقط وبشكل قدرة حرارية. أما القدرة في المحث الصرف أو المتسعة ذات السعة الصرف فتختزن في أحد أرباع الدورة ثم تعاد إلى المصدر في الربع الذي يليه.',
  pageEq:'pf = P real / P app = cos Φ',
  caption:'ما يجهزه المصدر ليس كله يُستهلك.',tryCap:'غيّر الرادات وراقب عامل القدرة والعمودين.',
  read:()=>`<div class="body"><p>القدرة المستهلكة في المقاومة تسمى <b>القدرة الحقيقية</b> P<sub>real</sub> = I<sub>R</sub>V<sub>R</sub> وتقاس بوحدة Watt. ومن مخطط المتجهات V<sub>R</sub> = V<sub>T</sub> cosΦ، ولأن التيار متساوٍ في دائرة التوالي: P<sub>real</sub> = I V<sub>T</sub> cosΦ.</p>

  build(){const g=new THREE.Group();const st={R:40,XL:120,XC:90,V:200,th:0};this.st=st;const rig=seriesRig(g);rig.S.g.visible=false;

LESSONS.push({ch:3,id:'10-3',num:'10-3',title:'الاهتزاز الكهرومغناطيسي',en:'Electromagnetic oscillation',bookPage:115,figure:'دائرة محث ومتسعة (L-C)',hint:'راقب الطاقة تنتقل بين المتسعة والمحث، ثم أضف مقاومة.',

  read:()=>`<div class="body"><p>ابتداءً تكون المتسعة مشحونة بكامل شحنتها، فتكون الطاقة الكلية مختزنة في المجال الكهربائي بين صفيحتيها (PE<sub>electric</sub> = ½Q²/C). ثم تبدأ بتفريغ شحنتها خلال المحث، فينساب تيار يولد مجالاً مغناطيسياً، ويختزن قسم من الطاقة في المجال المغناطيسي للمحث (PE<sub>magnetic</sub> = ½LI²).</p>

  eq:()=>`<div class="eqbox sm">PE<sub>electric</sub> = ½ × ${fr('Q<sup>2</sup>','C')}  ·  PE<sub>magnetic</sub> = ½ L I<sup>2</sup></div><div class="eqbox">f<sub>r</sub> = ${fr('1','2π√(LC)')}  ·  ω<sub>r</sub> = ${fr('1','√(LC)')}</div>`,

    g.add(wire([[-.29,y,.15],[-.34,y,.15],[-.34,y,.42],[.3,y,.42],[.3,y,.15],[.22,y,.15]]),wire([[-.07,y,.15],[.14,y,.15]]));

    const bar=(x,col,t)=>{const fr_=B(.08,.3,.05,new THREE.MeshLambertMaterial({color:0xefece4}));fr_.position.set(x,0,-.3);g.add(fr_);const f=B(.06,1,.052,new THREE.MeshLambertMaterial({color:col,emissive:col,emissiveIntensity:.3}));f.position.set(x,.01,-.3);g.add(f);const l=label(160,56);l.set([t],{dir:'ltr'});l.sprite.position.set(x,.38,-.3);g.add(l.sprite);return f};
    const uE=bar(.1,0x3d9467,'UE'),uB=bar(-.1,0x7b5cd6,'UB');const lab=label(300,90);lab.sprite.position.set(0,.5,-.1);g.add(lab.sprite);

LESSONS.push({ch:3,id:'11-3',num:'11-3 · 12-3',title:'الرنين وعامل النوعية',en:'Resonance · Quality factor',bookPage:117,figure:'دائرة توليف متوالية الربط مع مصباح',hint:'حرّك التردد حتى يضيء المصباح بأقصى توهج، ثم غيّر المقاومة.',

  read:()=>`<div class="body"><p>الإشارة الراديوية عند تردد معين تنتج تياراً في دائرة الاستقبال، ويكون بأعظم مقدار إذا كان تردد دائرة الاستقبال (دائرة التنغيم) مساوياً لتردد الإشارة المتسلمة. عندئذ تكون رادة الحث مساوية لرادة السعة (ωL = 1/ωC)، وهذا يجعل ممانعة الدائرة بأقل مقدار (Z = R). تسمى هذه الحالة <b>الرنين الكهربائي</b>.</p>
  <p>إذا كان تردد الدائرة أكبر من التردد الرنيني تعمل بخواص حثية (X<sub>L</sub> &gt; X<sub>C</sub>)، وإذا كان أصغر منه تعمل بخواص سعوية، وعند التردد الرنيني تعمل بخواص مقاومة صرف.</p>

  terms:[['ωr','التردد الزاوي الرنيني'],['Δω','نطاق التردد الزاوي عند منتصف القدرة العظمى'],['Qf','عامل النوعية']],

LESSONS.push({ch:4,id:'3-4',num:'3-4',title:'توليد الموجات الكهرومغناطيسية من الشحنات المعجلة',en:'Waves from accelerated charges',bookPage:135,figure:'ثنائي قطب كهربائي مربوط بمذبذب',hint:'شغّل المذبذب وراقب انفصال حلقات المجال عن الهوائي.',
  pageText:'أول من تمكن من توليد الموجات الكهرومغناطيسية هنري هرتز عام 1887 بإحداث شرارة كهربائية. الشحنة الساكنة تولد مجالاً كهربائياً فقط، والمتحركة بسرعة ثابتة تولد مجالين ثابتين، أما الشحنات المعجلة فتولد مجالين متذبذبين ينتشران في الفضاء.',
  pageEq:'a ≠ 0  ⟹  EM wave',
  caption:'شحنات تتسارع ذهاباً وإياباً فتطلق حلقات المجال إلى الفضاء.',tryCap:'شغّل المذبذب، ثم جرّب شحنة تتحرك بسرعة ثابتة وقارن.',
  read:()=>`<div class="body"><p><b>تجربة هرتز:</b> أحدث شرارة كهربائية بين قطبي الملف الثانوي لجهاز ملف الحث، ونجح في استقبال الموجات في فجوة بين نهايتي حلقة معدنية، إذ لاحظ تولد شرارة بينهما عند وضع معين من غير أسلاك توصيل. ولاحظ أن الشرارة لا يتم استقبالها إلا إذا كانت الحلقة ذات قطر محدد وفتحتها موازية للخط الواصل بين قطبي الإرسال.</p>
  <p><b>ثنائي القطب الكهربائي:</b> ساقان معدنيان مربوطان بمذبذب كهربائي.</p></div>
  <div class="tablewrap"><table class="mini"><tr><td>1</td><td>تتحرك الشحنات الموجبة نحو الأعلى والسالبة نحو الأسفل، وتكون خطوط المجال الكهربائي من الموجب إلى السالب، وخطوط المجال المغناطيسي دوائر عمودية عليها.</td></tr><tr><td>2</td><td>عندما تبلغ القوة الدافعة مقدارها الأعظم تصل الشحنات إلى الطرفين البعيدين وتصبح سرعتها صفراً.</td></tr><tr><td>3</td><td>عندما تتناقص تنعكس حركة الشحنات، فتتقارب نهايتا خطوط المجالين لتكون حلقة مغلقة تنتشر في الفضاء.</td></tr><tr><td>4</td><td>عند انقلاب القطبية يصبح المجال الكهربائي بعكس اتجاهه السابق وكذلك المجال المغناطيسي.</td></tr></table></div>
  <p class="def">من هذا التتابع تتكون حلقات مغلقة لخطوط المجالين في مستويات متعامدة تنتشر بعيداً عن ثنائي القطب، تمثل جبهات الموجات الكهرومغناطيسية.</p>`,
  predict:{q:'أي الشحنات الآتية تولد موجات كهرومغناطيسية تنتشر في الفضاء؟',options:['الشحنة الساكنة','الشحنة المتحركة بسرعة ثابتة','الشحنة المعجلة'],correct:2,
    why:'الشحنة الساكنة تولد مجالاً كهربائياً فقط، والمتحركة بسرعة ثابتة تولد مجالين ثابتين لا يتذبذبان. أما المعجلة، كالشحنات المتذبذبة في الهوائي، فتولد مجالين متذبذبين ينفصلان وينتشران موجةً.'},
  eq:()=>`<div class="eqbox sm">ساكنة ⟸ E فقط  ·  سرعة ثابتة ⟸ E و B ثابتان</div><div class="eqbox">معجّلة ⟸ E و B متذبذبان ينتشران</div>`,
  terms:[['Oscillator','مولد الذبذبات (المذبذب الكهربائي)'],['Electric dipole','ثنائي القطب الكهربائي'],['Antenna','الهوائي']],
  example:null,
  build(){const g=new THREE.Group();const st={on:true,mode:'acc',t:0,lastEmit:0};this.st=st;
    const osc=B(.12,.08,.1,new THREE.MeshLambertMaterial({color:0x8fc49a}));osc.position.set(-.34,0,0);g.add(osc);const ol=label(170,56);ol.set(['مذبذب']);ol.sprite.position.set(-.34,.15,.05);g.add(ol.sprite);
    const top=Cy(.008,.16,new THREE.MeshLambertMaterial({color:0xe7a59a}),10);top.position.set(-.2,.24,0);const bot=Cy(.008,.16,new THREE.MeshLambertMaterial({color:0x9ab4e6}),10);bot.position.set(-.2,.04,0);g.add(top,bot);
    g.add(wire([[-.28,.06,0],[-.2,.2,0]]),wire([[-.28,.04,0],[-.2,.2,0]]));const qp=S(.016,posMat),qn=S(.016,negMat);g.add(qp,qn);
    this.loops=[];this.ref={qp,qn,g};return g},
  emit(sign){const g=this.ref.g;const pts=[];for(let i=0;i<=40;i++){const a=-1.25+2.5*i/40;pts.push(new THREE.Vector3(Math.cos(a),Math.sin(a)*.9,0))}
    const eLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x3d9467,transparent:true}));eLine.position.set(-.2,.2,0);g.add(eLine);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1,.012,6,48),new THREE.MeshBasicMaterial({color:0x7b5cd6,transparent:true}));ring.rotation.x=Math.PI/2;ring.position.set(-.2,.2,0);g.add(ring);
    const dot=new THREE.Mesh(new THREE.SphereGeometry(.012,8,6),basic(sign>0?0x3d9467:0x7b5cd6));this.loops.push({eLine,ring,age:0})},
  update(dt){const st=this.st,R=this.ref;const w=2*Math.PI*.45;if(st.on)st.t+=dt;let y;if(st.mode==='acc'){y=.07*Math.sin(w*st.t)}else{y=-.07+((st.t*.06)%.14)}
    R.qp.position.set(-.2,.2+.04+Math.max(0,y)+.02,0);R.qn.position.set(-.2,.2-.04-Math.max(0,y)-.02,0);
    if(st.on&&st.mode==='acc'&&st.t-st.lastEmit>Math.PI/w){st.lastEmit=st.t;this.emit(Math.sin(w*st.t)>0?1:-1)}
    this.loops=this.loops.filter(l=>{l.age+=dt;const r=.03+l.age*.11;l.eLine.scale.set(r,r,1);l.ring.scale.set(r*.95,r*.95,r*.95);const o=Math.max(0,1-l.age/5.5);l.eLine.material.opacity=o;l.ring.material.opacity=o*.8;if(o<=0){R.g.remove(l.eLine);R.g.remove(l.ring);return false}return true})},
  controls(el){const L=this;el.append(seg([['acc','شحنات متذبذبة (معجّلة)'],['const','شحنة بسرعة ثابتة']],L.st.mode,v=>{L.st.mode=v}),h('div',{class:'btns'},toggleBtn(L.st.on,'المذبذب: يعمل','المذبذب: متوقف',v=>{L.st.on=v})),
    h('p',{class:'hint'},'الأقواس الخضراء: حلقات خطوط المجال الكهربائي تنفصل عن الهوائي. الدوائر البنفسجية: خطوط المجال المغناطيسي حول الهوائي. مع الشحنة ذات السرعة الثابتة لا تنفصل حلقات جديدة.'))}
});

LESSONS.push({ch:4,id:'4-4',num:'4-4 · 5-4',title:'مبادئ الإرسال والتسلم ودوائرهما',en:'Transmission and reception',bookPage:137,figure:'محطة إرسال وجهاز استقبال',hint:'غيّر سعة متسعة جهاز الاستقبال حتى يضيء مصباحه.',
  pageText:'تنقل المعلومات من الموجة السمعية (المحمولة) إلى الموجة الراديوية (الحاملة) وتبث عن طريق محطة الإرسال وتستقبل بجهاز الاستقبال. وتعتمد عملية الإرسال والتسلم على جهازين أساسيين: دائرة الاهتزاز الكهرومغناطيسي والهوائي.',
  pageEq:'fr = 1 / (2π√LC)',
  caption:'التوليف: جعل تردد دائرة الاستقبال يساوي تردد المحطة.',tryCap:'حرّك سعة متسعة الاستقبال حتى يتطابق ترددها مع المحطة.',
  read:()=>`<div class="body"><p><b>1. الدائرة المهتزة (دائرة الرنين):</b> ملف L مهمل المقاومة الأومية يتصل مع متسعة متغيرة السعة C، ويمكن أن تولد تردداً رنينياً f<sub>r</sub> من خلال عملية التوليف.</p>
  <p><b>2. الهوائي:</b> سلكان معدنيان منفصلان يربطان بمصدر فولطية متناوبة، فيشحنان بشحنتين متساويتين بالمقدار ومختلفتين بالنوع، وتتبدد الطاقة المنبعثة منه بشكل موجات كهرومغناطيسية. تعتمد قدرته على مقدار الفولطية المجهزة له وتردد الإشارة. وقد وجد عملياً أن طول الهوائي عندما يساوي نصف طول الموجة يحقق إرسالاً أو استقبالاً أكبر طاقة. ويمكن تأريض أحد قطبيه ليكون هوائياً بطول ربع موجة.</p>
  <p><b>دائرة الإرسال (1-5-4):</b> تتغذى الدائرة المهتزة بالطاقة فتولد موجات الإشارة، ويتحكم في ترددها بتغيير سعة المتسعة أو معامل الحث. تحث هذه الموجات تياراً متناوباً في ملف الهوائي بالتردد نفسه، فتتولد قوة دافعة في سلكه يبث الموجات إلى الفضاء.</p>
  <p><b>دائرة التسلم (2-5-4):</b> يستقبل الهوائي الموجات فيتولد فيه تيار متناوب بترددها، ويولد في ملفه إشارة كهربائية. نغير سعة المتسعة في دائرة الاهتزاز إلى أن تصل إلى حالة الرنين.</p></div>
  <div class="note"><b>هل تعلم (للاطلاع)</b>عادة عندما نلمس هوائي الراديو تزداد شدة المستقبل تحسناً، لأن الهوائي يصبح ربع طول موجة زيادة على أن سعة المتسعة تقل فيزداد عامل الجودة ويصير الانتقاء حاداً وجيداً.</div>`,
  predict:{q:'ما طول الهوائي الذي يحقق أكبر طاقة إرسال أو استقبال؟',options:['ضعف طول الموجة','نصف طول الموجة','أي طول، لا فرق'],correct:1,
    why:'وجد عملياً أن الهوائي الذي طوله نصف طول الموجة يحقق أكبر طاقة. عندها تكون الفولطية عظمى عند نهايتيه والتيار أعظم عند منتصفه (نقطة التغذية) فتكون الممانعة قليلة. وبتأريض أحد قطبيه يكفي ربع طول الموجة.'},
  eq:()=>`<div class="eqbox">f<sub>r</sub> = ${fr('1','2π√(LC)')}</div><div class="eqbox sm">λ = ${fr('c','f')}  ·  ℓ = ${fr('λ','2')}  ·  ℓ<sub>grounded</sub> = ${fr('λ','4')}</div>`,
  terms:[['fr','التردد الرنيني لدائرة التوليف'],['λ','الطول الموجي'],['ℓ','طول الهوائي']],
  example:[{name:'مثال (1) من الكتاب',q:'ضبطت دائرة موالفة في جهاز راديو محطة إذاعية، إذ كانت قيمة المحاثة في الدائرة 6.4μH وقيمة السعة 1.9pF. ما تردد الموجات التي يلتقطها الجهاز، وما طولها الموجي؟',
    steps:[['التردد:','f<sub>r</sub> = 1/(2π√(6.4×10<sup>−6</sup> × 1.9×10<sup>−12</sup>)) = 1/(2 × 3.14 × √(12.16×10<sup>−18</sup>))'],['النتيجة:','<b>f<sub>r</sub> = 45.665×10<sup>6</sup> Hz</b>'],['الطول الموجي:','λ = c/f<sub>r</sub> = 3×10<sup>8</sup>/45.665×10<sup>6</sup> = <b>6.57 m</b>']]},
   {name:'مثال (2) من الكتاب',q:'يراد استعمال هوائي نصف موجة لإرسال إشارات لاسلكية للترددين 20kHz و 200MHz. احسب طول الهوائي لكل منهما، وأيهما مناسب للاستعمال العملي.',
    steps:[['عند 20kHz:','λ = 3×10<sup>8</sup>/20×10<sup>3</sup> = 15 km  ⟹  ℓ = λ/2 = <b>7.5 km</b> (لا يمكن استعماله عملياً)'],['الحل العملي:','نحمّل هذا التردد على موجة حاملة عالية التردد بعملية التضمين'],['عند 200MHz:','λ = 3×10<sup>8</sup>/200×10<sup>6</sup> = 1.5 m  ⟹  ℓ = λ/2 = <b>75 cm</b>'],['بعد التأريض (ربع موجة):','ℓ = λ/4 = 150/4 = <b>37.5 cm</b>، وهو الأنسب عملياً']]}],
  build(){const g=new THREE.Group();const st={C:1.9,t:0};this.st=st;
    const tx=tower(.36);tx.position.set(-.34,0,-.05);g.add(tx);const tb=B(.14,.06,.1,new THREE.MeshLambertMaterial({color:0xe3e0d8}));tb.position.set(-.34,0,.2);g.add(tb);const tl=label(220,60);tl.set(['محطة الإرسال']);tl.sprite.position.set(-.34,.5,-.05);g.add(tl.sprite);
    const rx=tower(.24);rx.position.set(.32,0,-.05);g.add(rx);const radio=B(.18,.1,.1,new THREE.MeshLambertMaterial({color:0xc9a26b}));radio.position.set(.3,0,.2);g.add(radio);const dial=CyH(.025,.02,null,20);dial.rotation.x=Math.PI/2;dial.position.set(.36,.05,.26);g.add(dial);
    const lp=lampObj();lp.g.position.set(.22,.1,.2);lp.g.scale.setScalar(.7);g.add(lp.g);const rl=label(220,60);rl.set(['جهاز الاستقبال']);rl.sprite.position.set(.32,.38,-.05);g.add(rl.sprite);
    this.arcs=[];for(let i=0;i<6;i++){const pts=[];for(let k=0;k<=30;k++){const a=-.7+1.4*k/30;pts.push(new THREE.Vector3(Math.cos(a),Math.sin(a),0))}const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x3d9467,transparent:true}));l.position.set(-.34,.3,-.05);g.add(l);this.arcs.push(l)}
    const lab=label(330,110);lab.sprite.position.set(0,.58,-.1);g.add(lab.sprite);this.ref={lp,dial,lab};return g},
  L:6.4e-6,ftx(){return 1/(2*Math.PI*Math.sqrt(this.L*1.9e-12))},frx(){return 1/(2*Math.PI*Math.sqrt(this.L*this.st.C*1e-12))},
  update(dt){const st=this.st,R=this.ref;st.t+=dt;this.arcs.forEach((l,i)=>{const ph=((st.t*.25+i/6)%1);const r=.03+ph*.66;l.scale.set(r,r,1);l.material.opacity=1-ph});
    const d=(this.frx()-this.ftx())/this.ftx();const resp=1/(1+(d*60)**2);R.lp.set(resp);R.dial.rotation.z=st.C;R.lab.set([`fr = ${(this.frx()/1e6).toFixed(2)} MHz`,`المحطة: ${(this.ftx()/1e6).toFixed(2)} MHz`],{dir:'rtl'});if(this.sync)this.sync(resp)},
  controls(el){const L=this;const r=reads([['f','تردد دائرة الاستقبال fr'],['l','الطول الموجي λ'],['a','طول هوائي نصف الموجة'],['q','قوة الإشارة المستقبلة']]);

    const upd=()=>{const f=L.frx();r.set('f',`${(f/1e6).toFixed(3)} MHz`);r.set('l',`${(C0/f).toFixed(2)} m`);r.set('a',`${(C0/f/2).toFixed(2)} m`)};L.sync=resp=>r.set('q',`${Math.round(resp*100)}%`);
    upd();el.append(s.el,r.el,h('p',{class:'hint'},'المحطة تبث على 45.665 MHz كما في مثال (1). عندما تصل السعة إلى 1.9 pF يحصل الرنين ويضيء المصباح.'))}
});

LESSONS.push({ch:4,id:'6-4',num:'6-4',title:'الكشف عن الموجات الكهرومغناطيسية ذات التردد الراديوي',en:'Detecting radio waves',bookPage:141,figure:'هوائي مستقيم وهوائي حلقي أمام موجة قادمة',hint:'أمِل الهوائي المستقيم وأدر الهوائي الحلقي وقارن الإشارتين.',
  pageText:'يمكن الكشف عن الموجات الكهرومغناطيسية إما بوساطة مجالها الكهربائي أو بوساطة مجالها المغناطيسي.',
  pageEq:'ε ind = −N ΔΦB / Δt',
  caption:'هوائي للمجال الكهربائي، وحلقة للمجال المغناطيسي.',tryCap:'غيّر اتجاه كل هوائي وراقب قوة الإشارة.',
  read:()=>`<div class="body"><p><b>1-6-4 بوساطة المجال الكهربائي:</b> يعمل المجال الكهربائي للموجة E<sub>y</sub> على جعل الشحنات تهتز في الهوائي، فعندما يكون E<sub>y</sub> موجباً تكون قمة الهوائي موجبة، ثم تنعكس قطبيته في اللحظة التالية مباشرة، فتتحرك الشحنة إلى أعلى وإلى أسفل الهوائي. وخلال هذه العملية يحث التيار المتغير جهداً مهتزاً في الدائرة الرنينية المرتبطة بالهوائي بالحث المتبادل، وعند تغيير السعة للحصول على الرنين نحصل على الإشارة.</p>

  const ys=slits===1?[0]:slits===2?[-gap/2,gap/2]:[];let edges=[-D/2];ys.forEach(z=>{edges.push(z-w/2,z+w/2)});edges.push(D/2);

  read:()=>`<div class="body"><p><b>الجسيمات والموجات (4-6):</b> الضوء في ظرف معين يُظهر الصفة الجسيمية أو الصفة الموجية، ولكن ليس كلاهما في آن واحد، فالنظريتان تكمل إحداهما الأخرى. وطاقة الإشعاع تنتقل بشكل فوتونات يقودها باتجاه سيرها مجال موجي. ومن E = hf و E = mc² يسلك الفوتون كما لو كانت له «كتلة» m = hf/c²، وزخمه p = mc، فيكون λ = h/p.</p>
  <p><b>الموجات المادية (5-6):</b> افترض دي بروي أنه «في كل نظام ميكانيكي لابد من وجود موجات ترافق (تصاحب) حركة الجسيمات المادية». فالإلكترون مصحوب بموجة ليست ميكانيكية ولا كهرومغناطيسية، بل من نوع جديد يسمى الموجات المادية، إذ يمثل الجسيم برزمة موجية (wave packet) أي موجة ذات مدى محدود في الفضاء، نحصل عليها من إضافة موجات ذوات طول موجي مختلف قليلاً.</p>

function lattice(g,n=3,sp=.14,y=.12,cx=0,cz=0){const atoms=[];const am=new THREE.MeshLambertMaterial({color:0x5b6170});for(let i=0;i<n;i++)for(let j=0;j<n;j++){const a=new THREE.Mesh(new THREE.SphereGeometry(.03,18,14),am);a.position.set(cx+(i-(n-1)/2)*sp,y,cz+(j-(n-1)/2)*sp);a.castShadow=true;g.add(a);atoms.push(a)}
  const bonds=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++){const p=atoms[i*n+j].position;if(i<n-1){const q=atoms[(i+1)*n+j].position;const b=beam(p,q,0xe3c26a,.9);g.add(b);bonds.push({a:p.clone(),b:q.clone()})}if(j<n-1){const q=atoms[i*n+j+1].position;const b=beam(p,q,0xe3c26a,.9);g.add(b);bonds.push({a:p.clone(),b:q.clone()})}}

LESSONS.push({ch:7,id:'3-7',num:'3-7 · 4-7',title:'الموصلات والعوازل وأشباه الموصلات وحزم الطاقة',en:'Conductors, insulators, semiconductors and energy bands',bookPage:202,figure:'مخطط حزم الطاقة للمواد الثلاث',hint:'بدّل نوع المادة وارفع درجة الحرارة.',

  pageEq:'حزمة التكافؤ · الثغرة · حزمة التوصيل',
  caption:'عرض الثغرة بين الحزمتين يقرر: موصل أم عازل أم شبه موصل.',tryCap:'بدّل المادة وارفع الحرارة، وراقب الإلكترونات التي تعبر الثغرة.',
  read:()=>`<div class="body"><p><b>الموصل:</b> تسهل حركة الشحنات خلاله (النحاس، الفضة، الذهب، الألمنيوم)، لأن لذراته إلكترون تكافؤ واحد يرتبط بالنواة ارتباطاً ضعيفاً جداً فيصير حراً. <b>العازل:</b> لا يسمح بانسياب التيار في الظروف الاعتيادية، فإلكترونات التكافؤ مرتبطة ارتباطاً وثيقاً بالنواة. <b>شبه الموصل:</b> تتحرك فيه الشحنات بحرية أقل مما في الموصل.</p>
  <p><b>حزمة التكافؤ</b> (Valence Band): مستويات طاقة واطئة مملوءة كلياً أو جزئياً بالإلكترونات. <b>حزمة التوصيل</b> (Conduction Band): مستويات ذات طاقة عالية، وإلكتروناتها تنتقل بسهولة لتشارك في التوصيل. <b>ثغرة الطاقة المحظورة</b> (Forbidden Energy Gap): لا تحتوي مستويات مسموحاً بها، والإلكترون لكي ينتقل عبرها يحتاج طاقة خارجية (حرارية أو ضوئية أو مجال كهربائي) لا تقل عن مقدارها.</p></div>

  predict:{q:'لماذا لا تمتلك المادة العازلة قابلية توصيل كهربائية؟',options:['لأن حزمة التكافؤ فيها خالية','لأن ثغرة الطاقة المحظورة واسعة فلا تعبرها إلكترونات التكافؤ','لأنها لا تحتوي على إلكترونات'],correct:1,
    why:'في العازل الثغرة نحو 5eV أو أكثر، والطاقة المجهزة عادة أقل منها، فتبقى حزمة التكافؤ مملوءة وحزمة التوصيل خالية. لكن مجالاً كهربائياً كبيراً جداً أو تأثيراً حرارياً كبيراً قد يؤدي إلى انهيار العازل.'},
  eq:()=>`<div class="eqbox sm">طاقة العبور ≥ مقدار ثغرة الطاقة المحظورة</div><p class="hint">عدد الإلكترونات العابرة يزداد بارتفاع الحرارة وبضيق الثغرة.</p>`,
  terms:[['Valence band','حزمة التكافؤ'],['Conduction band','حزمة التوصيل'],['Forbidden gap','ثغرة الطاقة المحظورة'],['ρ','المقاومة الكهربائية النوعية']],

  build(){const g=new THREE.Group();const st={m:'semi',T:300,t:0};this.st=st;const S=texPlane(.7,.44,640);S.mesh.position.set(0,.26,-.1);g.add(S.mesh);const fr_=B(.72,.46,.01,new THREE.MeshLambertMaterial({color:0x3a3d40}));fr_.position.set(0,.03,-.108);g.add(fr_);
    this.dots=[];for(let i=0;i<40;i++)this.dots.push({x:Math.random(),y:Math.random(),up:false,ph:Math.random()*6});this.ref={S};return g},
  update(dt){const st=this.st,R=this.ref;st.t+=dt;const M=MATS7[st.m];const S=R.S,x=S.x;const ax=bandDiagram(S,{vTop:M.vt,cBot:M.cb,top:M.top,gapLabel:st.m==='cond'?'':M.g});

});

LESSONS.push({ch:7,id:'5-7',num:'5-7',title:'أشباه الموصلات النقية',en:'Intrinsic semiconductors',bookPage:205,figure:'بلورة سليكون وأواصرها التساهمية',hint:'ارفع درجة الحرارة ثم سلّط مجالاً كهربائياً.',
  pageText:'يعد الجرمانيوم (Ge) والسليكون (Si) من أهم أشباه الموصلات الأكثر استعمالاً في التطبيقات الإلكترونية، إذ تحتوي كل ذرة منهما على أربعة إلكترونات تكافؤ، فتتحد كل ذرة سليكون مع أربع ذرات مجاورة بأواصر تساهمية.',
  pageEq:'الزوج: إلكترون – فجوة',
  caption:'الحرارة تكسر آصرة فيولد زوج: إلكترون حر وفجوة موجبة.',tryCap:'ارفع الحرارة لتوليد أزواج، ثم شغّل المجال الكهربائي.',
  read:()=>`<div class="body"><p>تنشأ ثمانية إلكترونات تكافؤ، يكوّن كل زوج منها آصرة تساهمية تربط كل ذرتين متجاورتين في بلورة السليكون وتجعل البلورة في حالة استقرار كيميائي.</p>
  <p>عند ارتفاع درجة حرارة شبه الموصل النقي إلى درجة حرارة الغرفة (300K) تكتسب إلكترونات التكافؤ طاقة كافية لكسر بعض الأواصر التساهمية فتنتقل إلى حزمة التوصيل وتصبح إلكترونات حرة. ويترك كل إلكترون حيزاً فارغاً في حزمة التكافؤ يسمى <b>الفجوة</b> (hole) تعمل عمل الشحنة الموجبة، فيتولد ما يسمى <b>الزوج إلكترون-فجوة</b>.</p>
  <p>يزداد المعدل الزمني لتوليد الأزواج بارتفاع درجة الحرارة، فتقل المقاومة النوعية لشبه الموصل. ويعتمد هذا المعدل على درجة حرارة شبه الموصل ونوع مادته. وفي شبه الموصل النقي عند 300K يكون تركيز الفجوات مساوياً لتركيز الإلكترونات الحرة.</p>
  <p><b>تيار الإلكترونات والفجوات:</b> عند تسليط مجال كهربائي تنجذب الإلكترونات الحرة نحو الطرف الموجب فينشأ <b>تيار الإلكترونات</b>، ويتولد في حزمة التكافؤ <b>تيار الفجوات</b> باتجاه المجال. والتيار الكلي مجموعهما، وتسمى الإلكترونات والفجوات <b>حوامل الشحنة</b>.</p>
  <p><b>مستوى فيرمي</b> (Fermi level): أعلى مستوى طاقة مسموح به يمكن أن يشغله الإلكترون عند الصفر المطلق، ويقع في أشباه الموصلات النقية في منتصف ثغرة الطاقة المحظورة.</p></div>
  <div class="note"><b>تذكّر</b>ثغرة الطاقة: عند الصفر المطلق 1.2eV للسليكون و 0.78eV للجرمانيوم، وعند 300K تصبح 1.1eV للسليكون و 0.72eV للجرمانيوم.</div>`,

    why:'الإلكترونات الحرة تتحرك عكس المجال في حزمة التوصيل، والفجوات تتحرك باتجاه المجال في حزمة التكافؤ، والتيار الكلي مجموعهما. وهذا سؤال الكتاب (س1-5) ص 223.'},
  eq:()=>`<div class="eqbox sm">E<sub>g</sub>(Si) = 1.1 eV  ·  E<sub>g</sub>(Ge) = 0.72 eV   (عند 300K)</div><div class="eqbox">I<sub>total</sub> = I<sub>electrons</sub> + I<sub>holes</sub></div>`,
  terms:[['Hole','الفجوة: حيز فارغ يعمل عمل الشحنة الموجبة'],['Electron-hole pair','الزوج إلكترون-فجوة'],['Charge carriers','حوامل الشحنة'],['Fermi level','مستوى فيرمي']],
  example:null,
  build(){const g=new THREE.Group();const st={T:300,E:false,mat:'Si',t:0};this.st=st;this.L=lattice(g,4,.13,.12,-.02,.08);this.free=[];
    for(let i=0;i<8;i++){const e=new THREE.Mesh(new THREE.SphereGeometry(.011,10,8),negMat);const hm=holeMesh();g.add(e,hm);this.free.push({e,h:hm,k:i,ph:Math.random()})}
    const plL=B(.01,.2,.5,new THREE.MeshLambertMaterial({color:0xd4573b,transparent:true,opacity:.5}));plL.position.set(-.32,.02,.08);const plR=B(.01,.2,.5,new THREE.MeshLambertMaterial({color:0x2f6ad0,transparent:true,opacity:.5}));plR.position.set(.28,.02,.08);g.add(plL,plR);this.plates=[plL,plR];
    const l1=label(80,60);l1.set(['+'],{dir:'ltr',colors:['#c2432a']});l1.sprite.position.set(-.32,.3,.08);const l2=label(80,60);l2.set(['−'],{dir:'ltr',colors:['#2f6ad0']});l2.sprite.position.set(.28,.3,.08);g.add(l1.sprite,l2.sprite);this.pl=[l1,l2];return g},
  update(dt){const st=this.st;st.t+=dt;const Eg=st.mat==='Si'?1.1:.72;const n=Math.min(8,Math.round(8*Math.min(1,Math.exp(-Eg/(2*8.617e-5*Math.max(st.T,1)))*4e8/(st.mat==='Si'?1:30))));
    this.plates.forEach(p=>p.visible=st.E);this.pl.forEach(p=>p.sprite.visible=st.E);
    this.free.forEach((f,i)=>{const on=i<n;f.e.visible=on;f.h.visible=on;const bd=this.L.bonds[(i*5+3)%this.L.bonds.length];const home=bd.a.clone().lerp(bd.b,.5);home.y+=.012;this.L.pairs[((i*5+3)%this.L.bonds.length)*2].visible=!on;
      if(!on)return;f.ph+=dt*.15;const drift=st.E?((f.ph%1)):0;f.e.position.set(home.x+(st.E?-.5*drift+.25:Math.sin(st.t+i)*.04),.2+Math.sin(st.t*2+i)*.02,home.z+Math.cos(st.t+i)*.03);f.h.position.set(home.x+(st.E?.5*drift-.25:0),home.y,home.z)})},
  controls(el){const L=this;const r=reads([['g','ثغرة الطاقة عند 300K'],['s','الحالة',true]]);const upd=()=>{r.set('g',L.st.mat==='Si'?'1.1 eV':'0.72 eV');r.set('s',L.st.T<80?'يسلك سلوك العازل: لا أزواج':L.st.E?'تيار إلكترونات نحو الطرف الموجب، وتيار فجوات باتجاه المجال':'تتولد أزواج إلكترون-فجوة')};

      h('p',{class:'hint'},'الكرات الرمادية: ذرات، والخطوط الذهبية: أواصر تساهمية بإلكترونين. الكرة الزرقاء الحرة: إلكترون، والبيضاء: الفجوة التي تركها. عدد الأزواج توضيحي.'));upd()}
});

  read:()=>`<div class="body"><p><b>شبه الموصل نوع N:</b> نطعم بلورة نقية بشوائب خماسية التكافؤ (الأنتيمون Sb مثلاً). ترتبط الذرة الشائبة مع أربع ذرات سليكون مجاورة بأربعة من إلكترونات تكافئها، أما الإلكترون الخامس فيُترك حراً. تسمى الشائبة <b>الذرة المانحة</b> (Donor atom)، وتصير أيوناً موجباً مرتبطاً بالهيكل البلوري لا يُعد من حاملات الشحنة. وتضيف مستوى طاقة جديداً يسمى <b>المستوى المانح</b> يقع ضمن الثغرة وتحت حزمة التوصيل مباشرة، فيرتفع مستوى فيرمي ويقترب من حزمة التوصيل.</p>
  <p>في النوع N الإلكترونات هي <b>الحاملات الأغلبية</b> (Majority Carriers) لأنها تولدت من عمليتي التطعيم والتأثير الحراري، والفجوات <b>الحاملات الأقلية</b> (Minority Carriers) لأنها تولدت فقط من التأثير الحراري.</p>
  <p><b>شبه الموصل نوع P:</b> نطعم بذرات ثلاثية التكافؤ (البورون B، الألمنيوم، الإنديوم). تترك الشائبة آصرة تفتقر إلى إلكترون فتتولد فجوة. تسمى <b>الذرة القابلة</b> (Acceptor atom) وتصير أيوناً سالباً. وتضيف <b>المستوى القابل</b> فوق حزمة التكافؤ مباشرة، فينخفض مستوى فيرمي ويقترب منها. والفجوات هنا هي الحاملات الأغلبية.</p></div>
  <p class="def">صافي الشحنة الكلية للبلورة نوع N أو نوع P يساوي صفراً، أي متعادلة كهربائياً. سبب التسمية نوع الحاملات الأغلبية، لا شحنة البلورة.</p>`,

  eq:()=>`<div class="eqbox sm">N: خماسية التكافؤ (Sb) ⟸ مستوى مانح تحت حزمة التوصيل</div><div class="eqbox sm">P: ثلاثية التكافؤ (B) ⟸ مستوى قابل فوق حزمة التكافؤ</div>`,

LESSONS.push({ch:7,id:'7-7',num:'7-7 · 8-7',title:'الثنائي PN وفولطية الانحياز',en:'PN diode and biasing',bookPage:210,figure:'ثنائي pn وبطارية متغيرة',hint:'حرّك فولطية البطارية من الانحياز العكسي إلى الأمامي.',

  read:()=>`<div class="body"><p>تنتشر الإلكترونات الحرة في المنطقة N القريبة من الملتقى إلى المنطقة P مولدة أيونات موجبة في N، وتنتقل فجوات من P إلى N مولدة أيونات سالبة في P، فتنشأ منطقة رقيقة على جانبي الملتقى خالية من حاملات الشحنة تسمى <b>منطقة الاستنزاف</b> (Depletion region).</p>
  <p>يتوقف الانتشار عند حالة التوازن، لأن الأيونات تولد مجالاً كهربائياً يمنع عبور إلكترونات إضافية، ويسمى فرق الجهد الناتج <b>حاجز الجهد</b> (Potential barrier). يعتمد على نوع المادة ونسبة الشوائب ودرجة الحرارة، ومقداره عند 300K يساوي 0.7V للسليكون و 0.3V للجرمانيوم.</p>

  <p><b>الانحياز العكسي:</b> السالب مع P والموجب مع N. تنجذب الحاملات مبتعدة عن الملتقى فتتسع منطقة الاستنزاف ويزداد حاجز الجهد وتزداد مقاومة الثنائي، فينساب تيار صغير جداً يسمى <b>التيار العكسي</b>.</p></div>
  <div class="note"><b>هل تعلم (للاطلاع)</b>منطقة الاستنزاف تعد عازلاً كهربائياً بين لوحي متسعة. في الانحياز الأمامي تضيق فتزداد السعة C = ε₀A/d، وفي العكسي تتسع فتقل السعة.</div>`,

    g.add(wire([[-.24,.1,.15],[-.34,.1,.15],[-.34,.02,.4],[-.06,.02,.4]]),wire([[.24,.1,.15],[.34,.1,.15],[.34,.02,.4],[.06,.02,.4]]));const bat=B(.12,.06,.07,new THREE.MeshLambertMaterial({color:0xe8e6e0}));bat.position.set(0,0,.4);g.add(bat);this.bl=label(220,56);this.bl.sprite.position.set(0,.13,.42);g.add(this.bl.sprite);
    const S=scrBox(g,.5,.3,0,-.24);this.ref={S};return g},
