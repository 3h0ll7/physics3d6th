  update(dt){const st=this.st;st.t+=dt;const vb=this.Vb();const w=Math.max(.012,Math.min(.16,.05*Math.sqrt(Math.max(.02,vb-st.V)/vb)));this.dep.scale.x=w;const I=this.I(st.V);const flow=Math.min(1,Math.max(0,I/40));

    this.e.forEach((p,i)=>{p.x=(p.x+dt*.25*flow)%1;const xx=.235-(.235-w/2)*(flow>0?p.x*1.6:p.x);p.m.position.set(Math.max(xx,flow>0?-.2:w/2+.005),-.01+.1*p.y+.04,.1+.1*p.z)});

LESSONS.push({ch:7,id:'9-7',num:'9-7',title:'بعض أنواع الثنائيات',en:'Types of diodes',bookPage:214,figure:'ثنائي متحسس للضوء وخلية شمسية وباعث للضوء ومعدل',hint:'اختر نوع الثنائي وجرّبه.',
  pageText:'الطاقة الضوئية الساقطة على الثنائي pn يمكن تحويلها إلى طاقة كهربائية، والثنائيات المستعملة لهذه الأغراض نوعان: الثنائي المتحسس للضوء وثنائي الخلية الضوئية أو الخلية الشمسية. وهناك ثنائيات تحول الطاقة الكهربائية إلى ضوء، وأخرى تعدل التيار.',
  pageEq:'LED · photodiode · rectifier',
  caption:'الملتقى نفسه: يحوّل الضوء كهرباء، والكهرباء ضوءاً، ويعدّل التيار.',tryCap:'اختر الثنائي، ثم حرّك المقبض وراقب ما يحدث.',
  read:()=>`<div class="body"><p><b>الثنائي المتحسس للضوء:</b> يربط بطريقة الانحياز العكسي قبل تسليط الضوء عليه، فيكون التيار ضعيفاً جداً يهمل. عند تعرضه للضوء تتولد حاملات جديدة بكمية تعتمد على شدة الضوء، ووجد عملياً أن التيار يتناسب طردياً مع شدة الضوء. يستعمل في كاشفات الضوء ومقياس لشدته.</p>
  <p><b>ثنائي الخلية الشمسية:</b> الفوتون الذي يمتلك طاقة تساوي أو تزيد على 1.1eV يولد زوج إلكترون-فجوة في السليكون، و0.72eV في الجرمانيوم، فيعمل الثنائي على توليد قوة دافعة كهربائية مقدارها 0.5V للسليكون و0.1V للجرمانيوم. تستعمل في الأقمار الصناعية، وتربط على التوالي لزيادة جهدها وعلى التوازي لزيادة قدرتها.</p>
  <p><b>الثنائي الباعث للضوء (LED):</b> يربط بطريقة الانحياز الأمامي، فتحصل إعادة التحام بين الإلكترونات والفجوات فتتحرر طاقة. إذا كانت مادته زرنيخيد الكاليوم (GaAs) تكون الطاقة المتحررة ضوئية. تبعث بألوان مختلفة (أحمر، أصفر، أخضر) على وفق المادة، وتزداد شدة الضوء بازدياد التيار الأمامي. وتستعمل في الحاسبات والساعات الرقمية بسبعة أضلاع.</p>
  <p><b>الثنائي المعدل للتيار:</b> يحول التيار المتناوب إلى تيار معدل بنصف موجة، إذ يكون محيزاً أمامياً في نصف الموجة ويحجب النصف الآخر. ويمكن الحصول على تيار معدل بموجة كاملة باستعمال أكثر من ثنائي (للاطلاع).</p></div>`,
  predict:{q:'الثنائي الباعث للضوء (LED) يبعث الضوء عندما:',options:['يحيّز باتجاه أمامي','يحيّز باتجاه عكسي','يكون حاجز الجهد عبر الملتقى كبيراً','يكون بدرجة حرارة الغرفة'],correct:0,
    why:'في الانحياز الأمامي تعبر الإلكترونات والفجوات الملتقى وتلتحم فتتحرر طاقة تظهر ضوءاً في مادة مثل GaAs. وهذا سؤال الكتاب (س1-8) ص 223.'},

LESSONS.push({ch:7,id:'10-7b',num:'10-7',title:'استعمال الترانزستور كمضخم',en:'Transistor as an amplifier',bookPage:219,figure:'دائرة مضخم وشاشتا الدخل والخروج',hint:'بدّل بين القاعدة المشتركة والباعث المشترك وقارن الطور والربح.',

  caption:'إشارة صغيرة تدخل، وإشارة أكبر تخرج: بالطور نفسه أو معكوسة.',tryCap:'بدّل نوع المضخم، وراقب ربح الفولطية والطور على الشاشة.',
  read:()=>`<div class="body"><p>تعتمد عملية التضخيم في الترانزستور على سيطرة دائرة الدخول ذات القدرة الواطئة على دائرة الخروج ذات القدرة العالية.</p>
  <p><b>ذو القاعدة المشتركة (القاعدة المؤرضة):</b> ملتقى (الباعث-قاعدة) محيّز أمامياً فمقاومة دائرة الدخول صغيرة جداً، وملتقى (الجامع-قاعدة) محيّز عكسياً فمقاومة دائرة الخروج كبيرة جداً. فيكون ربح الفولطية كبيراً، وربح التيار α = I<sub>C</sub>/I<sub>E</sub> أقل من الواحد الصحيح، وربح القدرة متوسطاً. والإشارة الخارجة بالطور نفسه مع الداخلة، لأن تيار الجامع يتغير باتجاه تيار الباعث نفسه.</p>
  <p><b>ذو الباعث المشترك (الباعث المؤرض):</b> القاعدة بجهد سالب نسبة إلى الباعث، والجامع بجهد سالب نسبة إلى كل منهما. أي تغيير صغير في جهد القاعدة يحدث تغيراً كبيراً في تيار دائرة (الجامع-قاعدة)، فيتولد فرق جهد كبير عبر مقاومة الحمل R<sub>L</sub>. ربح التيار α = I<sub>C</sub>/I<sub>B</sub> عالٍ، وربح الفولطية كبير، وربح القدرة كبير جداً. والإشارة الخارجة بطور معاكس للداخلة (فرق الطور 180°) لأن تيار الجامع يتغير باتجاه معاكس لتغير تيار القاعدة.</p></div>`,
  predict:{q:'فرق الطور بين الإشارة الخارجة والإشارة الداخلة في المضخم pnp ذي القاعدة المشتركة يساوي:',options:['صفراً','90°','180°','270°'],correct:0,
    why:'في القاعدة المشتركة يتغير تيار الجامع باتجاه تغير تيار الباعث نفسه، فالإشارتان بالطور نفسه. أما في الباعث المشترك فالفرق 180°. وهذا سؤال الكتاب (س1-15) ص 224.'},

    steps:[['ربح التيار:','α = I<sub>C</sub>/I<sub>E</sub> = 2.94×10<sup>−3</sup>/3×10<sup>−3</sup> = <b>0.98</b>'],['فولطية الدخول:','V<sub>in</sub> = I<sub>E</sub>R<sub>in</sub> = 3×10<sup>−3</sup> × 500 = 1.5 V'],['فولطية الخروج:','V<sub>out</sub> = I<sub>C</sub>R<sub>out</sub> = 2.94×10<sup>−3</sup> × 400000 = 1176 V'],['ربح الفولطية:','A<sub>v</sub> = 1176/1.5 = <b>784</b>']]},

  build(){const g=new THREE.Group();const st={mode:'cb',IE:3,IC:2.94,Rin:500,Rout:400,t:0};this.st=st;const S=scrBox(g,.66,.36,0,-.2);

const E8=n=>-13.6/(n*n);const HC8=HP*C0;const KB8=1.38e-23;
function ph8(c,s=.06){const g=glow(c,s);g.material.opacity=.95;return g}
function wlHex(nm){if(nm<380)return 0xb58cff;if(nm>750)return 0xff6a4a;const c=wl2rgb(nm);return new THREE.Color(Math.max(.15,c[0]),Math.max(.15,c[1]),Math.max(.15,c[2])).getHex()}
function wlCss(nm){if(nm<380)return '#b58cff';if(nm>750)return '#ff6a4a';return rgbS(wl2rgb(nm),1.1)}
const region8=nm=>nm<380?'فوق البنفسجية':nm>750?'تحت الحمراء':'المرئية';
const SER8={1:['لايمان','Lyman'],2:['بالمر','Balmer'],3:['باشن','Paschen'],4:['براكت','Brackett'],5:['فوند','Pfund']};
const lam8=(nu,nl)=>HC8/((E8(nu)-E8(nl))*QE)*1e9;
function stripDraw(x,X0,Y0,W,H,kind,o={}){const L0=380,L1=750,px=nm=>X0+(nm-L0)/(L1-L0)*W;
  if(kind==='black'){x.fillStyle='#050505';x.fillRect(X0,Y0,W,H)}else{for(let i=0;i<W;i++){x.fillStyle=rgbS(wl2rgb(L0+(L1-L0)*i/W),1.1);x.fillRect(X0+i,Y0,1.5,H)}}
  (o.lines||[]).forEach(nm=>{x.fillStyle=rgbS(wl2rgb(nm),1.3);x.fillRect(px(nm)-2,Y0,4,H)});
  (o.dark||[]).forEach(nm=>{x.fillStyle='rgba(0,0,0,.92)';x.fillRect(px(nm)-1.5,Y0,3,H)});
  (o.bands||[]).forEach(([a,b])=>{for(let nm=a;nm<b;nm+=1.6){x.fillStyle=rgbS(wl2rgb(nm),.6+.6*((b-nm)/(b-a)));x.fillRect(px(nm),Y0,1.2,H)}})}

LESSONS.push({ch:8,id:'7-8',num:'7-8',title:'تأثير كومبتن',en:'Compton effect',bookPage:239,figure:'فوتون يصطدم بإلكترون حر في هدف من الكرافيت',hint:'غيّر زاوية الاستطارة وراقب الزيادة في الطول الموجي.',

  eq:()=>`<div class="eqbox">λ′ − λ = ${fr('h','m<sub>e</sub>c')} (1 − cos θ)</div><div class="eqbox sm">${fr('h','m<sub>e</sub>c')} = 0.24×10<sup>−11</sup> m  (طول موجة كومبتن)</div><div class="eqbox sm">m<sub>e</sub> = 9.11×10<sup>−31</sup> kg  ·  c = 3×10<sup>8</sup> m/s</div>`,

LESSONS.push({ch:8,id:'10-8',num:'10-8',title:'آلية عمل الليزر',en:'Mechanism of laser action',bookPage:243,figure:'ذرة ذات مستويين وفوتونات',hint:'اختر نوع الانتقال وراقب ما يحدث للإلكترون والفوتون.',

LESSONS.push({ch:8,id:'11-8',num:'11-8',title:'توزيع بولتزمان والتوزيع المعكوس',en:'Boltzmann distribution and population inversion',bookPage:245,figure:'رفّان للذرات: المستوى الأرضي والمستوى المتهيج',hint:'غيّر درجة الحرارة وفرق الطاقة، ثم شغّل الضخ.',

  pageEq:'N2/N1 = exp[−(E2 − E1)/kT]',
  caption:'في الطبيعة الأرضي مزدحم دائماً، والليزر يحتاج أن نقلب هذا الترتيب.',tryCap:'غيّر الحرارة وفرق الطاقة، ثم شغّل الضخ لتحقيق التوزيع المعكوس.',
  read:()=>`<div class="body"><p>التوزيع (الاستيطان) (Population): عدد الذرات أو الجزيئات في المستوى الأرضي (N<sub>1</sub>) يكون أكثر من عددها في المستوى الأعلى للطاقة (N<sub>2</sub>)، أي N<sub>1</sub> &gt; N<sub>2</sub>. وقد تمكن العالم بولتزمان من إيجاد علاقة رياضية توضح توزيع الذرات أو الجزيئات في مستويات الطاقة سميت <b>بقانون بولتزمان</b>.</p>
  <p><b>التوزيع المعكوس (Population Inversion):</b> إذا كان النظام الذري غير متزن حرارياً فإن عدد الذرات في المستويات العليا للطاقة أكثر مما عليه في المستويات الواطئة، وهذا يخالف توزيع بولتزمان. هذه العملية تزيد من احتمالية الانبعاث المحفز وهي أساس توليد الليزر، وتحصل عندما تكون هناك شدة ضخ كافية ويتحقق ذلك بوجود مستوى طاقة ذي عمر زمني أطول نسبياً يسمى <b>المستوى شبه المستقر</b> (Metastable state).</p></div>

  eq:()=>`<div class="eqbox">${fr('N<sub>2</sub>','N<sub>1</sub>')} = exp[${fr('−(E<sub>2</sub> − E<sub>1</sub>)','kT')}]</div><div class="eqbox sm">k = 1.38×10<sup>−23</sup> J/K  ·  T بالكلفن</div>`,

  example:[{name:'مثال (3) من الكتاب',q:'إذا كان فرق الطاقة بين المستويين يساوي (kT) عند درجة حرارة الغرفة، احسب عدد الذرات N<sub>2</sub> بدلالة N<sub>1</sub>.',
    steps:[['قانون بولتزمان:','N<sub>2</sub>/N<sub>1</sub> = exp[−(E<sub>2</sub> − E<sub>1</sub>)/kT] = exp[−kT/kT]'],['التعويض:','N<sub>2</sub>/N<sub>1</sub> = exp(−1) = e<sup>−1</sup>'],['النتيجة:','N<sub>2</sub> = <b>0.37 N<sub>1</sub></b>، أي N<sub>1</sub> &gt; N<sub>2</sub>']]},
   {name:'مثال (4) من الكتاب',q:'وضح رياضياً أنه لا يتحقق التوزيع المعكوس عندما تكون الطاقة الحرارية (kT) مساوية لطاقة الفوتون الساقط.',
    steps:[['المعطيات:','E<sub>2</sub> − E<sub>1</sub> = hf  و  kT = hf'],['التعويض:','N<sub>2</sub>/N<sub>1</sub> = exp[−hf/hf] = exp(−1)'],['النتيجة:','N<sub>2</sub> = 0.37 N<sub>1</sub> ⟹ <b>N<sub>2</sub> &lt; N<sub>1</sub></b>، فلا يتحقق التوزيع المعكوس']]}],
  build(){const g=new THREE.Group();const st={T:300,dE:.0259,pump:false,t:0};this.st=st;const sh=(y)=>{const m=B(.5,.01,.12,new THREE.MeshLambertMaterial({color:0x8a6a48}));m.position.set(-.02,y,.2);g.add(m)};sh(.04);sh(.22);

    this.cnt[0].set([`N1 = ${N-n2}`],{dir:'ltr'});this.cnt[1].set([`N2 = ${n2}`],{dir:'ltr'});
    const S=this.S,x=S.x,W=S.W,H=S.H;x.fillStyle='#f7f4ec';x.fillRect(0,0,W,H);x.strokeStyle='#2c2a27';x.lineWidth=2;x.beginPath();x.moveTo(40,10);x.lineTo(40,H-24);x.lineTo(W-10,H-24);x.stroke();x.fillStyle='#2c2a27';x.font='600 15px "IBM Plex Sans Arabic"';x.fillText('E',46,22);x.fillText('N',W-24,H-30);

    const eY=v=>H-24-Math.min(4,v)/4*(H-40);const e2=st.dE*QE/(KB8*st.T);x.fillStyle='rgba(47,106,208,.7)';x.fillRect(40,eY(0)-6,(N-n2)/N*(W-60),6);x.fillStyle='rgba(212,87,59,.8)';x.fillRect(40,eY(Math.min(e2,3.9))-6,n2/N*(W-60),6);S.tex.needsUpdate=true;if(this.sync)this.sync(q)},

  read:()=>`<div class="body"><p><b>1. الوسط الفعال (Active Medium):</b> ذرات أو جزيئات أو أيونات المادة بحالتها الغازية أو السائلة أو الصلبة، والتي يمكن أن يحصل فيها التوزيع المعكوس عندما يجهز الوسط بالشدة الكافية لتهييجه.</p>
  <p><b>2. المرنان:</b> تجويف من مرآتين يوضع الوسط الفعال بينهما، إحداهما عاكسة كلياً تقريباً والثانية عاكسة جزئياً. الشعاع الموازي للمحور ينعكس بينهما، وفي كل انعكاس يحصل الانبعاث المحفز فيزداد عدد الفوتونات بعدد هائل فيحصل التضخيم، وتسمح المرآة الجزئية بخروج نسبة من الضوء.</p>
  <p><b>3. تقنية الضخ (pumping):</b> تجهيز الطاقة لذرات الوسط الفعال لنقلها إلى مستوى التهيج: (a) <b>الضخ الضوئي</b> بمصابيح وميضية كليزر الياقوت والنيديميوم، (b) <b>الضخ الكهربائي</b> بالتفريغ الكهربائي في الليزرات الغازية وليزر شبه الموصل، (c) <b>الضخ الكيميائي</b> بالتفاعل الكيميائي دون مصدر خارجي للقدرة.</p>
  <p><b>منظومات مستويات الليزر:</b> <b>الثلاثية</b> (E<sub>1</sub> الأرضي، E<sub>2</sub> شبه المستقر بعمر نحو 10<sup>−3</sup> s، E<sub>3</sub> التهيج بعمر نحو 10<sup>−8</sup> s) وتتطلب طاقة ضخ عالية. <b>الرباعية</b> (E<sub>4</sub>، E<sub>3</sub>، E<sub>2</sub>، E<sub>1</sub>) يتحقق فيها التوزيع المعكوس بين E<sub>3</sub> و E<sub>2</sub> لأن E<sub>2</sub> شبه فارغ، فتتطلب طاقة ضخ أقل.</p>
  <p><b>أنواع الليزر:</b> الحالة الصلبة (الياقوت، النيديميوم)، الغازي (الهيليوم-نيون، ثنائي أوكسيد الكربون)، الإكسايمر (ArF، KrF، XeCl: فوق البنفسجية)، الصبغة (الرودامين 6G: يمكن التحكم بطوله الموجي)، أشباه الموصلات (زرنيخيد الكاليوم)، الكيميائي (فلوريد الديتيريوم).</p>

  read:()=>`<div class="body"><p>تتكون النواة من البروتونات الموجبة الشحنة والنيوترونات المتعادلة الشحنة، ويطلق على البروتون أو النيوترون <b>بالنيوكليون</b>. يرمز للبروتون بالرمز (<sup>1</sup><sub>1</sub>p) أو (<sup>1</sup><sub>1</sub>H)، وللنيوترون بالرمز (<sup>1</sup><sub>0</sub>n).</p>
  <p>عدد البروتونات يسمى <b>العدد الذري (Z)</b>، وعدد النيوترونات يسمى <b>العدد النيوتروني (N)</b>، ومجموعهما يسمى <b>العدد الكتلي (A)</b>: A = Z + N، ويكتب الرمز <sup>A</sup><sub>Z</sub>X. فنواة الألمنيوم <sup>27</sup><sub>13</sub>Al فيها 14 نيوتروناً. <b>النظائر</b> نوى متساوية في العدد الذري وتختلف في عدد النيوترونات، مثل <sup>6</sup><sub>3</sub>Li و <sup>7</sup><sub>3</sub>Li و <sup>8</sup><sub>3</sub>Li.</p>
  <p><b>الكتلة:</b> تشكل كتلة النواة نحو 99.9% من كتلة الذرة، وتقاس بوحدة الكتلة الذرية: 1u = 1.66×10<sup>−27</sup> kg، وكتلة النواة التقريبية m′ = A×u. ومن علاقة آينشتاين E = mc² فإن الطاقة المكافئة لـ 1u تساوي تقريباً 931 MeV، أي c² = 931 MeV/u. <b>الشحنة:</b> q = Ze.</p>
  <p><b>الحجم:</b> أول تجربة لتقدير حجم النواة أجراها رذرفورد باستطارة جسيمات ألفا من نوى الذهب. نصف قطر النواة يتغير طردياً مع الجذر التكعيبي للعدد الكتلي: R = r<sub>0</sub>A<sup>1/3</sup>، و r<sub>0</sub> = 1.2×10<sup>−15</sup> m. ويستعمل <b>الفيرمي</b>: 1F = 10<sup>−15</sup> m. وكثافة النواة نحو 2.3×10<sup>17</sup> kg/m³، أي نحو 2.3×10<sup>14</sup> مرة بقدر كثافة الماء.</p></div>

  read:()=>`<div class="body"><p>في حال المعادلات النووية يجب أن يكون مجموع الأعداد الذرية ومجموع الأعداد الكتلية متساويين في طرفي المعادلة النووية، أي أن المعادلة النووية يجب أن تكون موزونة. التفاعل النووي هو ذلك التفاعل الذي يحدث تغيراً في خصائص وتركيب النواة الهدف.</p>
  <p>النيوترونات تعد قذائف مهمة في التفاعلات النووية؛ لأن شحنة النيوترون تساوي صفراً فيستطيع أن يدخل إلى النواة بسهولة جداً (أكثر بكثير من جسيمات ألفا أو البروتونات) لعدم وجود قوة كولوم الكهربائية التنافرية بينه وبين النواة.</p>
  <p><b>قوانين الحفظ في التفاعلات النووية:</b> (a) حفظ (الطاقة-الكتلة)، (b) حفظ الزخم الخطي، (c) حفظ الزخم الزاوي، (d) حفظ الشحنة الكهربائية (العدد الذري)، (e) حفظ عدد النيوكليونات (العدد الكتلي).</p>
  <p><b>طاقة التفاعل النووي:</b> لتفاعل a + X → Y + b تكون Q = [M<sub>a</sub> + M<sub>X</sub> − M<sub>Y</sub> − M<sub>b</sub>]c². فإذا كانت Q &gt; 0 يسمى <b>التفاعل المحرر للطاقة</b>، وإذا كانت Q &lt; 0 يسمى <b>التفاعل الماص للطاقة</b>.</p></div>`,
  predict:{q:'في التفاعل النووي ⁴₂He + ⁹₄Be → ᴬ₆C + ¹₀n، تكون قيمة العدد (A):',options:['13','12','5','6'],correct:1,
    why:'حفظ العدد الكتلي: 4 + 9 = A + 1، إذن A = 12. وحفظ العدد الذري: 2 + 4 = 6 + 0. وهذا سؤال الكتاب (س1-7) ص 278.'},

  example:[{name:'مثال (5) من الكتاب',q:'في التفاعل النووي <sup>4</sup><sub>2</sub>He + <sup>14</sup><sub>7</sub>N → <sup>17</sup><sub>8</sub>O + <sup>1</sup><sub>1</sub>H جد قيمة طاقة التفاعل بوحدة (MeV) ثم بيّن نوعيته. الكتل: N = 14.003074u، He = 4.002603u، O = 16.999132u، H = 1.007825u.',
    steps:[['العلاقة:','Q = [M<sub>a</sub> + M<sub>X</sub> − M<sub>Y</sub> − M<sub>b</sub>] × 931 MeV'],['التعويض:','Q = (4.002603 + 14.003074 − 16.999132 − 1.007825) × 931'],['النتيجة:','Q = (−0.001280) × 931 = <b>−1.192 MeV</b>'],['النوع:','Q &lt; 0، إذن التفاعل <b>ماص للطاقة</b>']]}],
  build(){const g=new THREE.Group();const st={k:'ruth',t:0};this.st=st;this.H={a:new THREE.Group(),X:new THREE.Group(),Y:new THREE.Group(),b:new THREE.Group()};Object.values(this.H).forEach(o=>g.add(o));this.gm=ph8(0xffe14a,.08);g.add(this.gm);

  rebuild(){const R=RX9[this.st.k];this.n={};['a','X','Y','b'].forEach(k=>{const p=R[k];this.n[k]=swapNuc(this.H[k],this.n[k],p[2]==='γ'?new THREE.Group():nuc9(p[1],p[0]-p[1],p[0]>100?.0065:.01,k.charCodeAt(0)))});

LESSONS.push({ch:9,id:'6-9',num:'6-9',title:'الانشطار النووي والتفاعل المتسلسل',en:'Nuclear fission and chain reaction',bookPage:272,figure:'نيوترون بطيء يشطر نواة يورانيوم',hint:'أدخل قضبان السيطرة أو أخرجها وراقب عدد النيوترونات في كل جيل.',

LESSONS.push({ch:9,id:'7-9',num:'7-9',title:'الاندماج النووي',en:'Nuclear fusion',bookPage:274,figure:'نواتا ديوتيريوم وتريتيوم تندمجان',hint:'ارفع درجة الحرارة حتى تتغلب النواتان على التنافر الكهربائي.',

  read:()=>`<div class="body"><p><b>الاندماج النووي:</b> تفاعل نووي تدمج فيه نواتان صغيرتان (خفيفتان بالكتلة) لتكوين نواة أثقل. وتكون كتلة النواة الأثقل أقل من مجموع كتلتي النواتين الخفيفتين الأصليتين، وفرق الكتلة يتحول إلى طاقة متحررة.</p>
  <p>تعد الشمس مفاعلاً نووياً اندماجياً حرارياً عملاقاً؛ فسلسلة عمليات اندماج نوى ذرات الهيدروجين لتوليد نواة الهيليوم هي العمليات الرئيسة في باطن الشمس (حيث درجة الحرارة حوالي 1.5×10<sup>7</sup> K) ضمن ما يسمى دورة (بروتون-بروتون). ويحرر الاندماج طاقة أكبر من الانشطار لكتل متساوية من الوقود، وطبقت هذه الحقيقة عسكرياً في <b>القنبلة الهيدروجينية</b>.</p>

  <div class="note"><b>هل تعلم</b>توجد دورة اندماج نووي أخرى تسمى دورة الكاربون، وهي تحدث في النجوم التي درجة حرارتها أعلى من درجة حرارة باطن الشمس.</div>`,
  predict:{q:'في الفيزياء النووية تسمى عملية اندماج نواتين صغيرتين (خفيفتين بالكتلة) لتكوين نواة أثقل:',options:['انشطاراً نووياً','عملية الأسر الإلكتروني','انحلال بيتا الموجبة','اندماجاً نووياً'],correct:3,

    steps:[['قبل:','2.014102 + 3.016049 = 5.030151 u'],['بعد:','4.002603 + 1.008665 = 5.011268 u'],['Q:','(5.030151 − 5.011268) × 931 = 0.018883 × 931 ≈ <b>17.6 MeV</b> = 3.5 + 14.1']]}],

function legend(ch){const L=[['var(--pos)','شحنة موجبة'],['var(--neg)','شحنة سالبة'],['var(--field)','المجال الكهربائي']];if(ch!==1)L.push(['var(--mag)','المجال المغناطيسي']);L.push(['var(--energy)',ch===2?'التيار المحتث والطاقة':'الطاقة المختزنة']);return h('div',{class:'legend','aria-label':'مفتاح الألوان'},L.map(([c,t])=>h('span',{class:'chip'},h('i',{style:'background:'+c}),t)))}

function prev(){if(bi>0)go(li,bi-1);else if(li>0)go(li-1,beatsOf(LESSONS[li-1]).length-1)}

/* page turn */
let turning=null;
function turnPage(from,to){const A=LESSONS[from],Bn=LESSONS[to];const fwd=to>from;
  turning={t:0,fwd,from:A,to:Bn};
  if(fwd){cvF1.getContext('2d').drawImage(cvL,0,0);drawScenePage(cvL,Bn,to);drawTextPage(cvF2,Bn,to);texL.needsUpdate=true}
  else{cvF2.getContext('2d').drawImage(cvR,0,0);drawTextPage(cvR,Bn,to);drawScenePage(cvF1,Bn,to);texR.needsUpdate=true}
  texF1.needsUpdate=texF2.needsUpdate=true;flip.visible=true;bendFlip(fwd?0:1,0)}
function finishTurn(){const T=turning;const idx=LESSONS.indexOf(T.to);if(T.fwd){drawTextPage(cvR,T.to,idx);texR.needsUpdate=true}else{drawScenePage(cvL,T.to,idx);texL.needsUpdate=true}flip.visible=false;turning=null}

{q:'متسعة ذات الصفيحتين المتوازيتين، مشحونة ومفصولة عن البطارية، الهواء يملأ الحيز بين صفيحتيها. أُدخلت مادة عازلة ثابت عزلها (k = 2) ملأت الحيز بين الصفيحتين، فإن مقدار المجال الكهربائي (Ek) بين صفيحتيها بوجود المادة العازلة مقارنة مع مقداره (E) في حالة الهواء يصير:',o:['E/4','2E','E','E/2'],c:3,w:'المجال الكهربائي داخل العازل يقل بمقدار ثابت العزل: Ek = E/k = E/2.'},
{q:'وحدة (Farad) تستعمل لقياس سعة المتسعة، وهي لا تكافئ إحدى الوحدات الآتية:',o:['Coulomb²/J','Coulomb/V','Coulomb × V²','J/V²'],c:2,w:'من `C = Q/V` نحصل على `Coulomb/V`، ومن `PE = ½Q²/C` نحصل على `Coulomb²/J`، ومن `PE = ½CV²` نحصل على `J/V²`. أما `Coulomb × V²` فليست وحدة سعة.'},
{q:'متسعة ذات الصفيحتين المتوازيتين سعتها C، قُرّبت صفيحتاها من بعضهما حتى صار البعد بينهما (⅓) ما كان عليه، فإن مقدار سعتها الجديدة يساوي:',o:['⅓ C','1/9 C','3 C','9 C'],c:2,w:'C = ε₀A/d، فالسعة تتناسب عكسياً مع البعد: تصغير البعد إلى الثلث يجعل السعة ثلاثة أمثال.'},
{q:'متسعة مقدار سعتها (20µF)، لكي تختزن طاقة في مجالها الكهربائي مقدارها (2.5J) يتطلب ربطها بمصدر فرق جهده مستمر يساوي:',o:['150 V','350 V','500 V','250 kV'],c:2,w:'`PE = ½CV²` إذن `V² = 2 × 2.5 / 20×10⁻⁶ = 2.5×10⁵` فيكون `V = 500 V`.'},
{q:'متسعة ذات الصفيحتين المتوازيتين سعتها (50µF)، الهواء يملأ الحيز بين صفيحتيها. إذا أُدخلت مادة عازلة بين صفيحتيها ازدادت سعتها بمقدار (60µF)، فإن ثابت عزل تلك المادة يساوي:',o:['0.45','0.55','1.1','2.2'],c:3,w:'السعة الجديدة `50 + 60 = 110µF`، و `k = Ck/C = 110/50 = 2.2`. انتبه: 60 هي مقدار الزيادة وليست السعة الجديدة.'},
{q:'وأنت في المختبر تحتاج إلى متسعة سعتها (10µF) والمتوافر لديك مجموعة من المتسعات المتماثلة من ذوات السعة (15µF)، فإن عدد المتسعات التي تحتاجها وطريقة الربط التي تختارها هي:',o:['العدد 4 تربط جميعاً على التوالي','العدد 6 تربط جميعاً على التوازي','العدد 3: اثنان منها تربط على التوالي ومجموعتهما تربط مع الثالثة على التوازي','العدد 3: اثنان منها تربط على التوازي ومجموعتهما تربط مع الثالثة على التوالي'],c:3,w:'اثنتان على التوازي: `15 + 15 = 30µF`، ثم مع الثالثة على التوالي: `(30 × 15)/(30 + 15) = 10µF`. أما الخيار (c) فيعطي `7.5 + 15 = 22.5µF`.'},
{q:'متسعة ذات الصفيحتين المتوازيتين رُبطت صفيحتاها بين قطبي بطارية تجهز فرق جهد ثابت، فإذا أُبعدت الصفيحتان عن بعضهما قليلاً مع بقاء البطارية موصولة بهما، فإن مقدار المجال الكهربائي بين الصفيحتين:',o:['يزداد، والشحنة المختزنة في أي من صفيحتيها تزداد','يقل، والشحنة المختزنة في أي من صفيحتيها تقل','يبقى ثابتاً، والشحنة المختزنة في أي من صفيحتيها تبقى ثابتة','يبقى ثابتاً، والشحنة المختزنة في أي من صفيحتيها تزداد'],c:1,w:'البطارية موصولة فيبقى V ثابتاً. E = V/d يقل بزيادة d، والسعة C = ε₀A/d تقل فتقل الشحنة Q = CV.'},
{q:'للحصول على أكبر مقدار سعة مكافئة لمجموعة المتسعات في الشكل (37) نختار الدائرة المربوطة في الشكل:',img:'f37',o:['الدائرة a','الدائرة b','الدائرة c','الدائرة d'],c:3,w:'الدائرة (a): `2 + 4 = 6µF` على التوالي مع `3µF` فتكون `2µF`. الدائرة (b): `2 + 1 = 3µF`. الدائرة (c): `12µF` و `6µF` على التوالي فتكون `4µF`. الدائرة (d): `2µF` و `2µF` على التوالي تكون `1µF`، ومعها `4µF` على التوازي فتكون `5µF`، وهي الأكبر.'},
{q:'متسعتان (C₁، C₂) ربطتا مع بعضهما على التوالي، ومجموعتهما ربطت بين قطبي بطارية، وكان مقدار سعة الأولى أكبر من مقدار سعة الثانية. وعند مقارنة فرق الجهد بين صفيحتي المتسعة الأولى (ΔV₁) مع فرق الجهد بين صفيحتي المتسعة الثانية (ΔV₂) نجد أن:',o:['ΔV₁ أكبر من ΔV₂','ΔV₁ أصغر من ΔV₂','ΔV₁ يساوي ΔV₂','كل الاحتمالات السابقة، يعتمد ذلك على شحنة كل منهما'],c:1,w:'في ربط التوالي تتساوى الشحنة في كل المتسعات، و ΔV = Q/C، فالمتسعة الأكبر سعة يكون فرق الجهد بين صفيحتيها أصغر.'},
{q:'ثلاث متسعات (C₁، C₂، C₃) مربوطة مع بعضها على التوازي ومجموعتها ربطت بين قطبي بطارية، وكان مقدار سعاتها (C₁ > C₂ > C₃). وعند مقارنة مقدار الشحنات (Q₁، Q₂، Q₃) المختزنة في أي من صفيحتي كل متسعة نجد أن:',o:['Q₃ > Q₂ > Q₁','Q₁ > Q₃ > Q₂','Q₁ > Q₂ > Q₃','Q₃ = Q₂ = Q₁'],c:2,w:'في ربط التوازي يتساوى فرق الجهد عبر كل المتسعات، و Q = CV، فالشحنة تتناسب طردياً مع السعة.'}]},
2:{p:'84–86',q:[
{q:'أي من الأشكال الآتية يتبين فيه الاتجاه الصحيح للتيار الكهربائي المحتث في الحلقة الموصلة؟ لاحظ الشكل (57).',img:'f57',o:['الشكل a','الشكل b','الشكل c','الشكل d'],c:0,w:'حسب قانون لنز: في (a) القطب الشمالي يقترب من الحلقة فيتولد تيار يجعل وجهها العلوي قطباً شمالياً ليتنافر معه، أي تيار معاكس لدوران عقارب الساعة عند النظر من الأعلى، وهو المرسوم. في (b) لا حركة فلا تيار أصلاً. في (c) القطب الشمالي يبتعد فيجب أن ينعكس اتجاه التيار عن (a)، لكنه رُسم بالاتجاه نفسه. في (d) الاتجاه المرسوم لا يقاوم ابتعاد القطب الجنوبي.'},
{q:'في الشكل (58) حلقة مصنوعة من النحاس وُضعت في مستوى الورقة وموصولة مع المقاومة R، سُلّط مجال مغناطيسي باتجاه عمودي على مستوى الورقة خارجاً من الورقة. في أي من الحالات التالية ينساب تيار محتث في المقاومة R اتجاهه من اليسار نحو اليمين؟',img:'f58',o:['عند تزايد الفيض المغناطيسي الذي يخترق الحلقة','عند تناقص الفيض المغناطيسي الذي يخترق الحلقة','عند ثبوت الفيض المغناطيسي الذي يخترق الحلقة','جميع الاحتمالات المذكورة آنفاً'],c:1,w:'تيار في R من اليسار إلى اليمين يصعد في الطرف الأيمن ويدور في الحلقة عكس عقارب الساعة، فيولد مجالاً خارجاً من الورقة، أي باتجاه المجال الأصلي نفسه. وحسب قانون لنز يحدث ذلك عندما يتناقص الفيض فيحاول التيار المحتث تعويض النقص. وعند ثبوت الفيض لا يتولد تيار.'},
{q:'عند سقوط الساق المغناطيسية (قطبها الشمالي إلى الأسفل) خلال حلقة واسعة من الألمنيوم موضوعة أفقياً، إذا نظرت إلى الحلقة من موقع فوقها لتحديد اتجاه التيار المحتث فيها، فإن اتجاه التيار المحتث في الحلقة يكون:',o:['دائماً باتجاه دوران عقارب الساعة','دائماً باتجاه معاكس لدوران عقارب الساعة','باتجاه دوران عقارب الساعة، ثم يكون صفراً للحظة، ثم يكون باتجاه معاكس لدوران عقارب الساعة','باتجاه معاكس لدوران عقارب الساعة، ثم يكون صفراً للحظة، ثم يكون باتجاه دوران عقارب الساعة'],c:3,w:'عند اقتراب القطب الشمالي يزداد الفيض نحو الأسفل فيتولد تيار يجعل وجه الحلقة العلوي قطباً شمالياً (عكس عقارب الساعة من الأعلى). لحظة مرور منتصف الساق لا يتغير الفيض فيصير التيار صفراً، وعند ابتعاد الساق يتناقص الفيض فينعكس التيار (مع عقارب الساعة).'},
{q:'عند سقوط الساق المغناطيسية خلال حلقة من الألمنيوم غير مقفلة (مقطوعة) موضوعة أفقياً تحت الساق، لاحظ الشكل (60):',o:['تتأثر الساق بقوة تنافر في أثناء اقترابها من الحلقة، ثم تتأثر بقوة تجاذب في أثناء ابتعادها عن الحلقة','تتأثر الساق بقوة تجاذب في أثناء اقترابها من الحلقة، ثم تتأثر بقوة تنافر في أثناء ابتعادها عن الحلقة','لا تتأثر الساق بأية قوة في أثناء اقترابها من الحلقة، أو في أثناء ابتعادها عن الحلقة','تتأثر الساق بقوة تنافر في أثناء اقترابها من الحلقة وكذلك تتأثر بقوة تنافر في أثناء ابتعادها عن الحلقة'],c:2,w:'الحلقة غير مقفلة، فتتولد قوة دافعة كهربائية محتثة لكن لا ينساب تيار محتث، فلا يتولد مجال مغناطيسي يؤثر في الساق.'},
{q:'في الشكل (61) ملف محلزن مجوف مربوط على التوالي مع مصباح كهربائي ومقاومة وبطارية ومفتاح، وعندما كان المفتاح مغلقاً كانت شدة توهج المصباح ثابتة. إذا أُدخلت ساق من الحديد المطاوع في جوف الملف فإن توهج المصباح في أثناء دخول الساق:',o:['يزداد','يقل','يبقى ثابتاً','يزداد ثم يقل'],c:1,w:'الحديد يزيد معامل الحث الذاتي فيزداد الفيض خلال الملف أثناء الإدخال، فتتولد قوة دافعة محتثة معاكسة تقلل التيار مؤقتاً فيقل التوهج.'},
{q:'عندما يدور ملف دائري حول محور شاقولي موازٍ لوجه الملف داخل مجال مغناطيسي كثافة فيضه منتظمة B أفقية، تولّد أعظم مقدار للقوة الدافعة الكهربائية المحتثة εmax. وعند زيادة عدد لفات الملف إلى ثلاثة أمثال ما كانت عليه وتقليل قطر الملف إلى نصف ما كان عليه ومضاعفة التردد الدوراني للملف، فإن المقدار الأعظم للقوة الدافعة الكهربائية المحتثة سيكون:',o:['(3/2) εmax','(1/4) εmax','(1/2) εmax','3 εmax'],c:0,w:'`εmax = NABω`. عدد اللفات يصير 3 أمثاله، والمساحة تتناسب مع مربع القطر فتصير ربعها، والتردد يتضاعف: `3 × ¼ × 2 = 3/2`.'},
{q:'تتحقق ظاهرة الحث الذاتي في ملف معين عندما:',o:['تُسحب ساق مغناطيسية بعيداً عن وجه الملف','يوضع هذا الملف بجوار ملف آخر ينساب فيه تيار كهربائي متغير المقدار لوحدة الزمن','ينساب في هذا الملف تيار كهربائي متغير المقدار لوحدة الزمن','تدوير هذا الملف داخل مجال مغناطيسي منتظم'],c:2,w:'الحث الذاتي: تتولد قوة دافعة محتثة في الملف بسبب تغير التيار المنساب فيه هو نفسه. الخيار (b) حث متبادل، و(a) و(d) حث بالحركة.'},
{q:'مقدار القوة الدافعة الكهربائية المحتثة على طرفي ساق موصلة تتحرك نسبة إلى مجال مغناطيسي في حالة سكون لا يعتمد على:',o:['طول الساق','قطر الساق','وضعية الساق نسبة للفيض المغناطيسي','كثافة الفيض المغناطيسي'],c:1,w:'ε = vBL sinθ: تعتمد على الطول والسرعة وكثافة الفيض والزاوية، ولا تعتمد على قطر الساق.'},
{q:'عندما تقل السرعة الزاوية لدوران ملف نواة المحرك الكهربائي نتيجة لازدياد الحمل الموصول مع ملفه، تتسبب في هبوط مقدار:',o:['القوة الدافعة الكهربائية المحتثة المضادة','الفولطية الموضوعة على طرفي ملف النواة','التيار المنساب في دائرة المحرك','فرق الجهد الضائع (IR) بين طرفي ملف النواة'],c:0,w:'القوة الدافعة المضادة تتناسب مع سرعة الدوران فتقل بقلة السرعة، وعندها يزداد التيار المنساب ويزداد فرق الجهد الضائع IR.'},
{q:'يمكن أن يُستحث تيار كهربائي في حلقة موصلة ومقفلة في العمليات التالية ما عدا واحدة منها، فالعملية التي لا يُستحث فيها التيار هي:',o:['حلقة موصلة ومقفلة تدور حول محور موازٍ لمستواها وعمودي على فيض مغناطيسي منتظم','وضع حلقة موصلة ومقفلة ومتجه مساحتها موازٍ لفيض مغناطيسي متغير لوحدة الزمن','وضع حلقة موصلة ومقفلة ومتجه مساحتها عمودي على فيض مغناطيسي متغير لوحدة الزمن','حلقة موصلة ومقفلة، متجه مساحتها موازٍ لفيض مغناطيسي منتظم، كُبست من جانبيها المتقابلين'],c:2,w:'متجه المساحة عمودي على سطح الحلقة. إذا كان عمودياً على الفيض فإن خطوط الفيض توازي سطح الحلقة ولا تخترقها، فيبقى الفيض صفراً مهما تغير المجال ولا يتولد تيار. في الحالات الأخرى يتغير الفيض المخترق للحلقة.'},
{q:'وحدة قياس كثافة الفيض المغناطيسي هي:',o:['weber','weber/s','weber/m²','weber·s'],c:2,w:'B = Φ/A، فوحدتها weber/m² وتسمى التسلا (T).'}]},
3:{p:'124–125',q:[
{q:'دائرة تيار متناوب متوالية الربط، الحمل فيها يتألف من مقاومة صرف (R)، يكون فيها مقدار القدرة المتوسطة لدورة كاملة أو لعدد صحيح من الدورات:',o:['يساوي صفراً، ومتوسط التيار يساوي صفراً','يساوي صفراً، ومتوسط التيار يساوي نصف المقدار الأعظم للتيار','نصف المقدار الأعظم للقدرة، ومتوسط التيار يساوي صفراً','نصف المقدار الأعظم للقدرة، ومتوسط التيار يساوي نصف المقدار الأعظم للتيار'],c:2,w:'القدرة في المقاومة موجبة دائماً ومتوسطها Pmax/2، أما التيار فيتناوب بين موجب وسالب فمتوسطه لدورة كاملة صفر.'},
{q:'دائرة تيار متناوب متوازية الربط تحتوي محثاً صرفاً ومتسعة ذات سعة صرف ومقاومة صرف (L-C-R)، لا يمكن أن يكون فيها:',o:['التيار خلال المتسعة متقدماً على التيار خلال المحث بفرق طور (Φ = π)','التيار خلال المتسعة متقدماً على التيار خلال المقاومة بفرق طور (Φ = π/2)','التيار خلال المقاومة والتيار خلال المتسعة يكونان بالطور نفسه (Φ = 0)','التيار خلال المحث يتأخر عن التيار خلال المقاومة بفرق طور (Φ = π/2)'],c:2,w:'في التوازي الفولطية مشتركة: تيار المقاومة بطور الفولطية، وتيار المتسعة يتقدم عليها π/2، وتيار المحث يتأخر عنها π/2. فلا يمكن أن يكون تيار المقاومة وتيار المتسعة بالطور نفسه.'},
{q:'في دائرة الاهتزاز الكهرومغناطيسي، عند اللحظة التي يكون فيها مقدار التيار صفراً، تكون الطاقة المختزنة في المجال الكهربائي بين صفيحتي المتسعة فيها:',o:['صفراً','بأعظم مقدار','نصف مقدارها الأعظم','تساوي 0.707 من مقدارها الأعظم'],c:1,w:'الطاقة تتبادل بين المتسعة والمحث. عندما يكون التيار صفراً تكون طاقة المجال المغناطيسي في المحث صفراً، فتكون الطاقة كلها في المتسعة، أي بأعظم مقدار.'},
{q:'دائرة تيار متناوب تحتوي مذبذباً كهربائياً فرق جهده ثابت المقدار، رُبطت بين طرفيه متسعة ذات سعة صرف سعتها ثابتة المقدار. عند ازدياد تردد فولطية المذبذب:',o:['يزداد مقدار التيار في الدائرة','يقل مقدار التيار في الدائرة','ينقطع التيار في الدائرة','أي من العبارات السابقة، يعتمد ذلك على مقدار سعة المتسعة'],c:0,w:'XC = 1/(2πfC) تقل بزيادة التردد، و I = V/XC فيزداد التيار.'},
{q:'دائرة تيار متناوب متوالية الربط تحتوي محثاً صرفاً ومتسعة ذات سعة صرف ومقاومة صرف (L-C-R)، فإن جميع القدرة في هذه الدائرة:',o:['تتبدد خلال المقاومة','تتبدد خلال المتسعة','تتبدد خلال المحث','تتبدد خلال العناصر الثلاثة في الدائرة'],c:0,w:'المحث الصرف والمتسعة الصرف يختزنان الطاقة ثم يعيدانها إلى المصدر، فمعدل قدرتهما صفر. القدرة الحقيقية تتبدد في المقاومة فقط.'},
{q:'دائرة تيار متناوب متوالية الربط تحتوي محثاً صرفاً ومتسعة ذات سعة صرف ومقاومة صرف (L-C-R) ومذبذباً كهربائياً، عندما يكون تردد المذبذب أصغر من التردد الرنيني لهذه الدائرة، فإنها تمتلك:',o:['خواص حثية، بسبب كون XL > XC','خواص سعوية، بسبب كون XC < XL','خواص أومية خالصة، بسبب كون XL = XC','خواص سعوية، بسبب كون XC > XL'],c:3,w:'تحت تردد الرنين تكون XL = 2πfL صغيرة و XC = 1/(2πfC) كبيرة، فتغلب الرادة السعوية. لاحظ أن الخيار (b) يقول "سعوية" لكن سببه مقلوب.'},
{q:'دائرة تيار متناوب متوالية الربط تحتوي محثاً صرفاً ومتسعة ذات سعة صرف ومقاومة صرف (L-C-R)، عندما تكون الممانعة الكلية للدائرة بأصغر مقدار وتيار هذه الدائرة بأكبر مقدار، فإن مقدار عامل القدرة فيها:',o:['أكبر من الواحد الصحيح','أقل من الواحد الصحيح','يساوي صفراً','يساوي واحداً صحيحاً'],c:3,w:'هذه حالة الرنين: XL = XC فتكون Z = R وزاوية الطور صفراً، وعامل القدرة cos 0 = 1. ولا يمكن أن يزيد عامل القدرة على الواحد.'},
{q:'دائرة تيار متناوب متوالية الربط تحتوي ملفاً غير مهمل المقاومة (L-R)، لجعل عامل القدرة في هذه الدائرة يساوي الواحد الصحيح تُربط في هذه الدائرة متسعة على:',o:['التوالي مع الملف بشرط أن تكون رادة الحث XL أصغر من رادة السعة XC','التوازي مع الملف بشرط أن تكون رادة الحث XL تساوي رادة السعة XC','التوالي مع الملف بشرط أن تكون رادة الحث XL أكبر من رادة السعة XC','التوالي مع الملف بشرط أن تكون رادة الحث XL تساوي رادة السعة XC'],c:3,w:'بربط متسعة على التوالي بحيث XC = XL تتحقق حالة الرنين فتصير الممانعة Z = R وعامل القدرة يساوي 1.'},
{q:'دائرة تيار متناوب متوازية الربط تحتوي محثاً صرفاً ومتسعة ذات سعة صرف ومقاومة صرف (L-C-R)، تكون لهذه الدائرة خواص حثية إذا كانت:',o:['رادة الحث XL أكبر من رادة السعة XC','رادة السعة XC أكبر من رادة الحث XL','رادة الحث XL تساوي رادة السعة XC','رادة السعة XC أصغر من المقاومة'],c:1,w:'في التوازي الفولطية مشتركة والتيار في كل فرع = V/X. إذا كانت XC أكبر من XL يكون تيار المحث أكبر من تيار المتسعة فيغلب التيار الحثي. انتبه: هذا عكس دائرة التوالي.'},
{q:'عند دوران ملف بسرعة زاوية منتظمة داخل مجال مغناطيسي منتظم نحصل على فولطية محتثة متناوبة، ويكون أعظم مقدار لها عندما تكون زاوية الطور (ωt) تساوي:',o:['π/√2','π/2','π','2π'],c:1,w:'ε = εmax sin(ωt)، وأعظم قيمة لها عندما sin(ωt) = 1 أي ωt = π/2، عندها يكون مستوى الملف موازياً لخطوط الفيض.'}]},
4:{p:'149',q:[
{q:'إن تيار الإزاحة (Id) يتناسب مع:',o:['المعدل الزمني للتغير في المجال المغناطيسي','المعدل الزمني للتغير في المجال الكهربائي','المعدل الزمني للتغير في تيار التوصيل','المعدل الزمني للتغير في تيار الاستقطاب'],c:1,w:'افترض ماكسويل أن المجال الكهربائي المتغير بين صفيحتي المتسعة يكافئ تياراً يسمى تيار الإزاحة، يتناسب مع المعدل الزمني لتغير المجال الكهربائي.'},
{q:'إن تذبذب الإلكترونات الحرة في موصل تنتج موجات تسمى:',o:['موجات الأشعة السينية','موجات أشعة كاما','موجات الأشعة تحت الحمراء','الموجات الراديوية'],c:3,w:'الشحنات المتذبذبة في سلك الهوائي تولد موجات كهرومغناطيسية ذات تردد راديوي. أما الأشعة السينية وكاما فتنشآن من عمليات ذرية ونووية.'},
{q:'يتحدد مقدار سرعة الموجة الكهرومغناطيسية في الأوساط المختلفة بوساطة:',o:['مقدار السماحية الكهربائية لذلك الوسط فقط','النفاذية المغناطيسية لذلك الوسط فقط','حاصل جمع سماحية ونفاذية ذلك الوسط','مقلوب الجذر التربيعي لحاصل ضرب مقدار السماحية والنفاذية لذلك الوسط'],c:3,w:'v = 1/√(µε)، وفي الفراغ c = 1/√(µ₀ε₀) = 3×10⁸ m/s.'},
{q:'الموجات الكهرومغناطيسية التي تستعمل في أجهزة الرادار هي:',o:['موجات الأشعة فوق البنفسجية','موجات أشعة كاما','موجات الأشعة السينية','موجات الأشعة الدقيقة (microwave)'],c:3,w:'الرادار يرسل نبضات من الموجات الدقيقة تنعكس عن الأجسام، ويستقبل صداها لتحديد موقعها وبعدها.'},
{q:'تتولد الموجات الراديوية عند:',o:['انسياب تيار مستمر في سلك موصل','حركة شحنة كهربائية بسرعة ثابتة في سلك موصل','حركة شحنة كهربائية معجلة في سلك موصل','وجود شحنات كهربائية ساكنة في سلك موصل'],c:2,w:'الشحنة الساكنة تولد مجالاً كهربائياً فقط، والمتحركة بسرعة ثابتة تولد مجالاً مغناطيسياً ثابتاً، أما الشحنة المعجلة (المتذبذبة) فتشع موجات كهرومغناطيسية.'},
{q:'للحصول على كفاءة عالية في عمليتي الإرسال والتسلم يستعمل هوائي طوله يبلغ نصف طول الموجة، وذلك لأن:',o:['مقدار الفولطية أكبر ما يمكن عند نقطة تغذية الهوائي','مقدار الفولطية أقل ما يمكن عند نقطة تغذية الهوائي','مقدار الفولطية والتيار أكبر ما يمكن عند نقطة تغذية الهوائي','مقدار الفولطية والتيار أقل ما يمكن عند نقطة تغذية الهوائي'],c:1,w:'في هوائي نصف الموجة تكون الفولطية عظمى عند نهايتيه، والتيار أعظم عند منتصفه (نقطة التغذية)، فتكون الفولطية هناك أقل ما يمكن والممانعة قليلة، فيُغذى الهوائي بأعظم قدرة (ص 138).'},
{q:'يمكن أن تُعجّل الشحنة الكهربائية في موصل عندما يؤثر فيها:',o:['مجال كهربائي ثابت','مجال كهربائي متذبذب','مجال كهربائي ومجال مغناطيسي ثابتان','مجال مغناطيسي ثابت'],c:1,w:'المجال الكهربائي المتذبذب يجعل الشحنات تهتز في الموصل، أي تتعجل باستمرار فتشع موجات. والمجال المغناطيسي الثابت لا يغير مقدار سرعة الشحنة. المقصود في سياق الفصل هو التعجيل المتذبذب الذي يولد الموجات.'},
{q:'في عملية التضمين الترددي (FM) نحصل على موجة مضمنة بسعة:',o:['ثابتة وتردد ثابت','متغيرة وتردد متغير','ثابتة وتردد متغير','متغيرة وتردد ثابت'],c:2,w:'في التضمين الترددي يتغير تردد الموجة الحاملة تبعاً للإشارة المحمولة وتبقى سعتها ثابتة. أما في التضمين السعوي (AM) فتتغير السعة ويبقى التردد ثابتاً.'},
{q:'تعكس طبقة الأيونوسفير في الجو الترددات الراديوية التي تكون:',o:['ضمن المدى (2–30) MHz','ضمن المدى (30–40) MHz','أكثر من (40) MHz','جميع الترددات الراديوية'],c:0,w:'الموجات السماوية (2–30 MHz) تنعكس عن طبقات الأيونوسفير، أما الترددات الأعلى فتنفذ خلالها ولذلك تستعمل الأقمار الصناعية للاتصال بها.'},
{q:'إن عملية الإرسال والتسلم للموجات الكهرومغناطيسية تعتمد على:',o:['قطر سلك الهوائي','كثافة سلك الهوائي','دائرة الاهتزاز الكهرومغناطيسي والهوائي','كل الاحتمالات السابقة'],c:2,w:'دائرة الاهتزاز الكهرومغناطيسي تولد الإشارة بالتردد المطلوب (أو تنتقيها بالرنين عند التسلم)، والهوائي يبثها أو يلتقطها (ص 140).'}]},
5:{p:'171–172',q:[
{q:'في حيود الضوء من شق واحد، فإن شرط تكوّن الهداب المضيء الأول (غير المركزي) أن يكون عرض الشق مساوياً إلى:',o:['λ','λ / (2 sinθ)','3λ / (2 sinθ)','λ / 2'],c:2,w:'شرط الهدب المضيء في الشق المفرد: `w sinθ = (m + ½)λ`، وللهدب الأول `m = 1` يكون `w sinθ = 3λ/2` إذن `w = 3λ/(2 sinθ)`.'},
{q:'تُعزى ألوان فقاعات الصابون إلى ظاهرة:',o:['التداخل','الحيود','الاستقطاب','الاستطارة'],c:0,w:'الضوء المنعكس عن السطحين الأمامي والخلفي للغشاء الرقيق يتداخل، فتتقوى أطوال موجية معينة بحسب سمك الغشاء فتظهر الألوان.'},
{q:'سبب ظهور هدب مضيئة وهدب مظلمة في تجربة شقي يونك هو:',o:['حيود وتداخل موجات الضوء معاً','حيود موجات الضوء فقط','تداخل موجات الضوء فقط','استعمال مصدرين ضوئيين غير متشاكهين'],c:0,w:'يحيد الضوء عند كل شق فينتشر خلفه، ثم تتراكب الموجتان الحائدتان فتتداخلان بناءً (هدب مضيئة) وإتلافاً (هدب مظلمة).'},
{q:'إذا سقط ضوء أخضر على محزز حيود فإن الهداب المركزي يظهر بلون:',o:['أصفر','أحمر','أخضر','أبيض'],c:2,w:'الهداب المركزي (m = 0) يكون بلون الضوء الساقط نفسه، ويظهر أبيض فقط إذا كان الضوء الساقط أبيض.'},
{q:'تزداد زاوية حيود الضوء مع:',o:['نقصان الطول الموجي للضوء المستعمل','زيادة الطول الموجي للضوء المستعمل','ثبوت الطول الموجي للضوء المستعمل','كل الاحتمالات السابقة معاً'],c:1,w:'d sinθ = mλ: لرتبة معينة تزداد sinθ بزيادة λ، لذلك يحيد الضوء الأحمر بزاوية أكبر من البنفسجي.'},
{q:'إذا كان فرق المسار البصري بين موجتين ضوئيتين متشاكهتين متراكبتين يساوي أعداداً فردية من أنصاف الأطوال الموجية، عندها يحصل:',o:['تداخل بناء','استطارة','استقطاب','تداخل إتلاف'],c:3,w:'فرق مسار (m + ½)λ يعني أن الموجتين تصلان بطورين متعاكسين فتلغي إحداهما الأخرى.'},
{q:'لحصول التداخل المستديم في موجات الضوء يجب أن يكون مصدراهما:',o:['متشاكهين','غير متشاكهين','مصدرين من الليزر','جميع الاحتمالات السابقة'],c:0,w:'التداخل المستديم يتطلب فرق طور ثابتاً بين الموجتين، أي مصدرين متشاكهين. مصدران مستقلان، حتى لو كانا ليزرين، لا يضمنان ثبات فرق الطور.'},
{q:'في تجربة شقي يونك، يحصل الهداب المضيء الأول على جانبي الهداب المركزي المضيء المتكون على الشاشة عندما يكون فرق المسار البصري مساوياً إلى:',o:['½ λ','λ','2λ','3λ'],c:1,w:'شرط الهدب المضيء: فرق المسار = mλ، والهداب الأول بعد المركزي m = 1 أي λ. أما ½λ فشرط الهداب المظلم الأول.'},
{q:'نمط التداخل يتولد عندما يحصل:',o:['الانعكاس','الانكسار','الحيود','الاستقطاب'],c:2,w:'في تجربة يونك يحيد الضوء من الشقين فتتراكب الموجتان الحائدتان وتتداخلان، فالحيود هو ما يجعل التراكب ممكناً.'},
{q:'أغشية الزيت الرقيقة وغشاء فقاعة صابون الماء تبدو ملونة بألوان زاهية نتيجة الانعكاس و:',o:['الانكسار','التداخل','الحيود','الاستقطاب'],c:1,w:'ينعكس الضوء عن سطحي الغشاء، والموجتان المنعكستان تتداخلان فتظهر الألوان.'}]},
6:{p:'196–197',q:[
{q:'عند ارتفاع درجة الحرارة المطلقة فإن ذروة التوزيع الموجي للإشعاع المنبعث من الجسم الأسود تنزاح نحو:',o:['الطول الموجي الأطول','الطول الموجي الأقصر','التردد الأقصر','ولا واحدة منها'],c:1,w:'قانون فين: λmax T = ثابت، فارتفاع T يقلل λmax، أي تنزاح الذروة نحو الأطوال الموجية الأقصر (الترددات الأعلى).'},
{q:'العبارة (في كل نظام ميكانيكي لا بد من وجود موجات ترافق (تصاحب) حركة الجسيمات المادية) هي تعبير عن:',o:['مبدأ اللادقة لهايزنبرك','اقتراح بلانك','قانون لينز','فرضية دي برولي'],c:3,w:'افترض دي برولي أن لكل جسيم متحرك موجة مرافقة طولها λ = h/p.'},
{q:'أي من الكميات التالية تعد ثابتة حسب النظرية النسبية؟',o:['سرعة الضوء','الزمن','الكتلة','الطول'],c:0,w:'من فرضيتي آينشتاين: سرعة الضوء في الفراغ ثابتة لجميع المراقبين، أما الزمن والطول والكتلة فتعتمد على سرعة الجسم.'},
{q:'إحدى الظواهر التالية تعد أحد الأدلة التي تؤكد أن للضوء سلوكاً جسيمياً:',o:['الحيود','الظاهرة الكهروضوئية','الاستقطاب','التداخل'],c:1,w:'فسر آينشتاين الظاهرة الكهروضوئية بأن الضوء فوتونات طاقة كل منها hf. أما الحيود والتداخل والاستقطاب فأدلة على السلوك الموجي.'},
{q:'افترض أنه قيس موضع جسيم بدقة تامة، أي أن (Δx = 0)، فإن أقل لادقة في زخم هذا الجسيم تساوي:',o:['h/4π','h/2π','ما لا نهاية','صفر'],c:2,w:'حاصل ضرب اللادقة في الموضع في اللادقة في الزخم لا يقل عن مقدار ثابت، فإذا كانت Δx = 0 يجب أن تكون Δp لانهائية.'},
{q:'عند مضاعفة شدة الضوء الساقط بتردد معين مؤثر في سطح معدن معين يتضاعف مقدار:',o:['الطاقة الحركية العظمى للإلكترونات الضوئية المنبعثة','جهد الإيقاف','زخم الفوتون','تيار الإشباع'],c:3,w:'مضاعفة الشدة تضاعف عدد الفوتونات فيتضاعف عدد الإلكترونات المنبعثة وتيار الإشباع. أما الطاقة الحركية العظمى وجهد الإيقاف وزخم الفوتون فتعتمد على التردد فقط.'},
{q:'وفقاً لمعادلة آينشتاين الشهيرة بتكافؤ الكتلة والطاقة فإن:',o:['E = m²c','E = c²m²','E = mc²','E = mc'],c:2,w:'E = mc²، و c سرعة الضوء في الفراغ.'},
{q:'كثافة الاحتمالية لإيجاد الجسيم في نقطة ولحظة معينتين تتناسب:',o:['طردياً مع |ψ|²','عكسياً مع |ψ|²','طردياً مع |ψ|','عكسياً مع |ψ|'],c:0,w:'دالة الموجة ψ نفسها لا معنى فيزيائياً مباشراً لها، أما مربع مقدارها |ψ|² فيتناسب مع احتمالية وجود الجسيم.'},
{q:'العبارة (من المستحيل أن نقيس آنياً (في الوقت نفسه) الموضع بالضبط وكذلك الزخم الخطي بالضبط لجسيم) هي تعبير عن:',o:['قانون فاراداي','قانون الإزاحة لفين','قانون ستيفان – بولتزمان','مبدأ اللادقة لهايزنبرك'],c:3,w:'هذا نص مبدأ اللادقة: كلما زادت دقة قياس الموضع قلت دقة قياس الزخم، والعكس صحيح.'},
{q:'الموجات المرافقة لحركة جسيم مثل الإلكترون هي:',o:['موجات ميكانيكية طولية','موجات ميكانيكية مستعرضة','موجات كهرومغناطيسية','موجات مادية'],c:3,w:'حسب دي برولي ترافق الجسيمات المتحركة موجات مادية λ = h/p، وهي ليست ميكانيكية ولا كهرومغناطيسية.'}]},
7:{p:'223–224',q:[
{q:'إذا كان الثنائي البلوري pn محيزاً باتجاه أمامي، فعند زيادة مقدار فولطية الانحياز الأمامي فإن مقدار التيار الأمامي:',o:['يزداد','يقل','يبقى ثابتاً','يزداد ثم ينقص'],c:0,w:'زيادة الانحياز الأمامي تضيّق منطقة الاستنزاف وتقلل حاجز الجهد، فتعبر حاملات أكثر ويزداد التيار.'},
{q:'عند زيادة حاجز الجهد في الثنائي البلوري pn المحيز انحيازاً أمامياً، فإن مقدار التيار الأمامي في دائرته:',o:['يزداد','يقل','يبقى ثابتاً','يزداد ثم ينقص'],c:1,w:'حاجز الجهد يعيق عبور الحاملات، فزيادته تقلل عدد الحاملات العابرة فيقل التيار.'},
{q:'الإلكترونات الحرة في شبه الموصل النقي وبدرجة حرارة الغرفة تشغل:',o:['حزمة التكافؤ','ثغرة الطاقة المحظورة','حزمة التوصيل','المستوى القابل'],c:2,w:'الإلكترون يصير حراً عندما يكتسب طاقة تكفي لعبور الثغرة فينتقل إلى حزمة التوصيل، تاركاً فجوة في حزمة التكافؤ. والثغرة لا تحتوي مستويات مسموحاً بها.'},
{q:'تتولد الأزواج إلكترون – فجوة، في شبه الموصل النقي، بوساطة:',o:['إعادة الالتحام','التأين','التطعيم','التأثير الحراري'],c:3,w:'الطاقة الحرارية تكسر بعض الأواصر التساهمية فيتولد إلكترون حر وفجوة معاً. أما التطعيم فيضيف حاملات من نوع واحد، وإعادة الالتحام تُفني الأزواج.'},
{q:'التيار المنساب في شبه الموصل النقي ناتج عن:',o:['الإلكترونات الحرة فقط','الفجوات فقط','الأيونات السالبة','الإلكترونات والفجوات كليهما'],c:3,w:'تيار الإلكترونات في حزمة التوصيل وتيار الفجوات في حزمة التكافؤ، والتيار الكلي مجموعهما.'},
{q:'في شبه الموصل نوع n وعند درجة حرارة الغرفة، يكون:',o:['عدد الإلكترونات الحرة في حزمة التوصيل يساوي عدد الفجوات في حزمة التكافؤ','عدد الإلكترونات الحرة في حزمة التوصيل أكبر من عدد الفجوات في حزمة التكافؤ','عدد الإلكترونات الحرة في حزمة التوصيل أقل من عدد الفجوات في حزمة التكافؤ','جميع الاحتمالات السابقة، يعتمد ذلك على نسبة الشوائب'],c:1,w:'في النوع n الإلكترونات حاملات أغلبية (من التطعيم والتأثير الحراري)، والفجوات حاملات أقلية (من التأثير الحراري فقط).'},
{q:'تتولد منطقة الاستنزاف في الثنائي pn بوساطة:',o:['إعادة الالتحام','التناضح','التأين','جميع الاحتمالات السابقة (a، b، c)'],c:3,w:'تنتشر (تتناضح) الإلكترونات من N إلى P والفجوات بالعكس، فتتولد أيونات موجبة وسالبة على جانبي الملتقى، وتلتحم الإلكترونات مع الفجوات القريبة، فتنشأ منطقة خالية من حاملات الشحنة (ص 211).'},
{q:'الثنائي pn الباعث للضوء (LED) يبعث الضوء عندما:',o:['يحيّز باتجاه أمامي','يحيّز باتجاه عكسي','يكون حاجز الجهد عبر الملتقى كبيراً','يكون بدرجة حرارة الغرفة'],c:0,w:'في الانحياز الأمامي تعبر الإلكترونات والفجوات الملتقى وتلتحم فتتحرر طاقة تظهر ضوءاً في مادة مثل GaAs.'},
{q:'تيار الباعث IE في دائرة الترانزستور يكون دائماً:',o:['أكبر من تيار القاعدة','أقل من تيار القاعدة','أكبر من تيار الجامع','الأجوبة (a و c)'],c:3,w:'IE = IB + IC، فهو أكبر من كل من تيار القاعدة وتيار الجامع.'},
{q:'منطقة الاستنزاف في الثنائي البلوري في المنطقة n تحتوي فقط:',o:['إلكترونات حرة','فجوات','أيونات موجبة','أيونات سالبة'],c:2,w:'الإلكترونات التي غادرت المنطقة n تترك خلفها ذرات مانحة صارت أيونات موجبة مرتبطة بالبلورة، ومنطقة الاستنزاف خالية من الحاملات.'},
{q:'يسلك السليكون سلوك العازل عندما يكون:',o:['نقياً','في الظلمة','بدرجة الصفر المطلق','الأجوبة الثلاث (a، b، c) مجتمعة'],c:3,w:'نص الكتاب (ص 205): عند درجات حرارية منخفضة جداً (0K) وفي انعدام الضوء تسلك مادة شبه الموصل النقي سلوك المادة العازلة. فالشروط الثلاثة مجتمعة.'},
{q:'يزداد المعدل الزمني لتوليد الأزواج إلكترون – فجوة في شبه الموصل:',o:['بإدخال شوائب خماسية التكافؤ','بإدخال شوائب ثلاثية التكافؤ','بارتفاع درجة الحرارة','ولا واحد مما سبق'],c:2,w:'الأزواج تتولد بكسر الأواصر حرارياً، فيزداد معدل توليدها بارتفاع الحرارة. أما الشوائب فتضيف حاملات من نوع واحد ولا تولد أزواجاً.'},
{q:'منطقة القاعدة في الترانزستور تكون:',o:['واسعة وقليلة الشوائب','واسعة وكثيرة الشوائب','رقيقة وقليلة الشوائب','رقيقة وكثيرة الشوائب'],c:2,w:'القاعدة رقيقة وقليلة التطعيم، فلا يلتحم فيها إلا جزء صغير من الحاملات ويعبر معظمها إلى الجامع.'},
{q:'ربح التيار (α) في المضخم pnp ذي الباعث المشترك هو نسبة:',o:['IE / IC','IB / IC','IC / IB','IC / IE'],c:2,w:'في الباعث المشترك تيار الدخول هو تيار القاعدة وتيار الخروج هو تيار الجامع: α = IC/IB، وهو كبير.'},
{q:'فرق الطور بين الإشارة الخارجة والإشارة الداخلة في المضخم pnp ذي القاعدة المشتركة يساوي:',o:['صفراً','90°','180°','270°'],c:0,w:'في القاعدة المشتركة يتغير تيار الجامع باتجاه تغير تيار الباعث نفسه فالإشارتان بالطور نفسه. أما في الباعث المشترك فالفرق 180°.'},
{q:'ربح التيار (α) في دائرة الترانزستور pnp المستعمل كمضخم ذي القاعدة المشتركة يساوي نسبة:',o:['IE / IB','IC / IE','IC / IB','IB / IE'],c:1,w:'في القاعدة المشتركة الدخول من الباعث والخروج من الجامع: α = IC/IE، وهو أقل من الواحد.'},
{q:'يقع مستوى فيرمي في شبه الموصل نوع N عند درجة حرارة (0K):',o:['أسفل المستوى المانح','منتصف المسافة بين قعر حزمة التوصيل والمستوى المانح','في منتصف ثغرة الطاقة','منتصف المسافة بين قمة حزمة التكافؤ والمستوى المانح'],c:1,w:'التطعيم بالمانحات يرفع مستوى فيرمي ويقربه من حزمة التوصيل، وعند 0K يقع في منتصف المسافة بين المستوى المانح وقعر حزمة التوصيل. منتصف الثغرة هو موقعه في شبه الموصل النقي.'},
{q:'مستوى فيرمي هو:',o:['معدل قيمة كل مستويات الطاقة','مستوى الطاقة في قمة حزمة التكافؤ','أعلى مستوى طاقة مشغول عند 0°C','أعلى مستوى طاقة مشغول عند 0K'],c:3,w:'مستوى فيرمي: أعلى مستوى طاقة مسموح به يمكن أن يشغله الإلكترون عند الصفر المطلق (0K)، لا عند 0°C.'}]},
8:{p:'252–253',q:[
{q:'يبين أنموذج بور للذرة أن:',o:['العناصر الغازية متماثلة في أطيافها الذرية','العناصر الصلبة المتوهجة متماثلة في أطيافها الذرية','العناصر السائلة المتوهجة متماثلة في أطيافها الذرية','لكل عنصر طيف ذري خاص به'],c:3,w:'مستويات الطاقة تختلف من عنصر إلى آخر، والفوتونات المنبعثة hf = Ef − Ei تعتمد عليها، فلكل عنصر طيف خطي خاص به.'},
{q:'عندما تُثار الذرة بطاقة إشعاعية متصلة فإن الذرة:',o:['تمتص الطاقة الإشعاعية كلها','تمتص الطاقة المناسبة لإثارة ذراتها','تمتص الطاقة بشكل مستمر','ولا واحدة منها'],c:1,w:'الذرة تمتص فقط الفوتونات التي طاقتها تساوي فرق الطاقة بين مستوياتها، ولهذا يظهر طيف الامتصاص خطوطاً معتمة.'},
{q:'نحصل على سلسلة لايمان في طيف الهيدروجين عند انتقال:',o:['إلكترون ذرة الهيدروجين من مستويات الطاقة (E₂، E₃، E₄، E₅) إلى المستوى الأول للطاقة','إلكترون ذرة الهيدروجين من مستويات الطاقة العليا (E₂، E₃، E₄، E₅) إلى المستوى الثاني للطاقة','إلكترون ذرة الهيدروجين من مستويات الطاقة العليا إلى المستوى الثالث للطاقة'],c:0,w:'سلسلة لايمان تنتهي عند المستوى الأرضي n = 1 وتقع في المنطقة فوق البنفسجية. الهبوط إلى n = 2 يعطي سلسلة بالمر، وإلى n = 3 سلسلة باشن.'},
{q:'في الحالة الطبيعية للمادة وحسب توزيع بولتزمان تكون:',o:['معظم الذرات في المستويات العليا للطاقة','معظم الذرات في المستويات الواطئة للطاقة','عدد الذرات في المستوى الأرضي أقل من عدد الذرات في المستويات الأعلى للطاقة','عدد الذرات في مستوى التهيج أكبر من عدد الذرات في المستوى الأرضي'],c:1,w:'N₂/N₁ = exp[−(E₂ − E₁)/kT] أقل من 1 دائماً في الاتزان الحراري. الخياران (c) و(d) يصفان التوزيع المعكوس الذي يتطلب ضخاً.'},
{q:'طيف ذرة الهيدروجين هو طيف:',o:['مستمر','امتصاص خطي','خطي','حزمي'],c:2,w:'ذرة الهيدروجين المتوهجة تبعث خطوطاً براقة محددة (طيف خطي)، وهذا ما عجز أنموذج رذرفورد عن تفسيره وفسره بور.'},
{q:'مقدار الزيادة في الطول الموجي لفوتونات الأشعة السينية المستطارة بوساطة الإلكترونات الحرة تعتمد على:',o:['طول موجة الفوتون الساقط','سرعة الضوء','كتلة الإلكترون','زاوية الاستطارة','نوع المعدن المستطيل'],c:3,w:'Δλ = (h/mₑc)(1 − cos θ): h و mₑ و c ثوابت، فالزيادة تعتمد على زاوية الاستطارة θ فقط.'},
{q:'تكون قدرة الضخ عالية عندما تعمل منظومة الليزر بنظام:',o:['ثلاثة مستويات','مستويين','أربعة مستويات','أي عدد من المستويات'],c:0,w:'في المنظومة الثلاثية يجب أن يزيد عدد الذرات في E₂ على عددها في المستوى الأرضي المزدحم، فتتطلب ضخاً عالياً. أما الرباعية فمستواها السفلي E₂ شبه فارغ.'},
{q:'يمكن استعمال عملية الضخ الكهربائي عندما يكون الوسط الفعال في الحالة:',o:['الصلبة','الغازية','السائلة','أي وسط فعال'],c:1,w:'الضخ الكهربائي يتم بالتفريغ الكهربائي للغاز داخل أنبوبة التفريغ، لذا يستعمل غالباً في الليزرات الغازية.'},
{q:'يحدث الفعل الليزري عند حدوث انبعاث:',o:['تلقائي ومحفز','محفز وتلقائي','تلقائي فقط','محفز فقط'],c:[0,1],w:'لا يمكن الحصول على الانبعاث المحفز من غير حصول الانبعاث التلقائي أولاً. والخياران (a) و(b) متكافئان في المعنى في الكتاب، لذلك يُحسب كلاهما صحيحاً هنا.'},
{q:'تعتمد عملية قياس المدى باستعمال أشعة الليزر على أحد خواصها وهي:',o:['التشاكه','الاستقطاب','أحادية الطول الموجي','الاتجاهية'],c:3,w:'الحزمة تبقى متوازية بانفراجية قليلة لمسافات بعيدة، فتصل إلى الهدف وتعود دون أن تتشتت.'}]},
9:{p:'278–279',q:[
{q:'نصف قطر النواة (R) يتغير تغيراً:',o:['طردياً مع A^⅓','عكسياً مع A^⅓','طردياً مع A³','عكسياً مع A³'],c:0,w:'R = r₀A^⅓ و r₀ = 1.2×10⁻¹⁵ m.'},
{q:'تكون قيم معدل طاقة الربط النووية لكل نيوكليون:',o:['أكبر لنوى العناصر الخفيفة','أكبر لنوى العناصر الثقيلة','متساوية لجميع نوى العناصر','أكبر لنوى العناصر المتوسطة'],c:3,w:'منحني معدل طاقة الربط يبلغ قمته للنوى المتوسطة مثل ⁵⁶Fe، لذا فهي الأكثر استقراراً.'},
{q:'كل مما يلي من خصائص القوة النووية ما عدا أنها:',o:['تربط وتمسك بنيوكليونات النواة','لا تعتمد على الشحنة','ذات مدى طويل جداً','الأقوى في الطبيعة'],c:2,w:'القوة النووية ذات مدى قصير جداً (داخل النواة فقط)، وهي الأقوى في الطبيعة ولا تعتمد على الشحنة.'},
{q:'إذا افترضنا أن طاقة الربط النووية لنواة النيون (²⁰₁₀Ne) تساوي (161 MeV)، فإن معدل طاقة الربط النووية لكل نيوكليون لنواة النيون بوحدات (MeV) يساوي:',o:['8.05','16.1','3220','1610'],c:0,w:'`E′b = Eb/A = 161/20 = 8.05 MeV` لكل نيوكليون. انتبه: القسمة على العدد الكتلي A وليس العدد الذري Z.'},
{q:'تنحل نواة نظير البولونيوم (²¹⁸₈₄Po) تلقائياً إلى نواة نظير الرصاص (²¹⁴₈₂Pb) بوساطة انحلال:',o:['كاما','بيتا السالبة','بيتا الموجبة','ألفا'],c:3,w:'العدد الكتلي نقص 4 والعدد الذري نقص 2، وهذه بصمة انحلال ألفا (⁴₂He).'},
{q:'عندما تعاني نواة تلقائياً انحلال بيتا الموجبة فإن عددها الذري:',o:['يزداد بمقدار واحد','يقل بمقدار واحد','يقل بمقدار أربعة','لا يتغير'],c:1,w:'يتحول بروتون إلى نيوترون وبوزترون ونيوترينو، فيقل Z بواحد ويبقى A ثابتاً.'},
{q:'في التفاعل النووي التالي: ⁴₂He + ⁹₄Be → ᴬ₆C + ¹₀n تكون قيمة العدد (A) هي:',o:['13','12','5','6'],c:1,w:'حفظ العدد الكتلي: `4 + 9 = A + 1` إذن `A = 12`.'},
{q:'في الفيزياء النووية تسمى عملية اندماج نواتين صغيرتين (خفيفتين بالكتلة) لتكوين نواة أثقل:',o:['انشطاراً نووياً','عملية الأسر الإلكتروني','انحلال بيتا الموجبة','اندماجاً نووياً'],c:3,w:'هذا تعريف الاندماج النووي، وهو مصدر طاقة الشمس.'},
{q:'من مصادر الإشعاع النووي الخلفي الطبيعي هي:',o:['الغبار المتساقط من اختبارات الأسلحة النووية','الأشعة الكونية','الإشعاعات النووية المنتجة من المفاعلات النووية','ولا واحدة منها'],c:1,w:'المصادر الطبيعية: الأشعة الكونية والقشرة الأرضية والنشاط الإشعاعي في جسم الإنسان. أما الغبار النووي وإشعاعات المفاعلات فمصادر اصطناعية.'},
{q:'تتم عملية الانشطار النووي لنواة اليورانيوم (²³⁵₉₂U) باستعمال:',o:['بروتون ذي طاقة صغيرة','جسيمة ألفا ذات طاقة صغيرة','نيوترون بطيء','ولا واحدة منها'],c:2,w:'النيوترون متعادل فلا يتنافر مع النواة، والنيوترون البطيء (الحراري، نحو 0.025 eV) يُمتص بسهولة فتنشطر النواة.'}]}

const zOut=h('button',{type:'button',id:'zOut','aria-label':'تصغير المشهد',title:'تصغير المشهد (−)',onclick:()=>setZoom(zoomT*1.25),html:ic('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8 11h6"/>')});
const zP=h('button',{type:'button',id:'zReset',class:'zpb','aria-label':'إعادة الحجم الأصلي',title:'الحجم الأصلي (0)',onclick:()=>{setZoom(1);yawHome=true;panHome();setSpin(false)}},h('span',{class:'zp',dir:'ltr'},'100%'));
const b360=h('button',{type:'button',id:'b360','aria-label':'دوران الكتاب 360 درجة','aria-pressed':'false',title:'دوران 360°',onclick:()=>{yawHome=false;setSpin(!spin)},html:ic('<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/><text x="12" y="14.6" text-anchor="middle" font-size="6.6" font-weight="700" stroke="none" fill="currentColor" font-family="IBM Plex Sans Arabic,system-ui">360</text>')});
const tPop=h('div',{class:'tpop',hidden:true,role:'group','aria-label':'حجم خط النص'},
  h('button',{type:'button',id:'tDn','aria-label':'تصغير خط النص',onclick:()=>setText(txt-.1),html:ic('<path d="M4 19l4.5-11L13 19M5.8 15h5.4"/><path d="M15 9h6"/>')}),
  h('span',{class:'tp',dir:'ltr'},'100%'),
  h('button',{type:'button',id:'tUp','aria-label':'تكبير خط النص',onclick:()=>setText(txt+.1),html:ic('<path d="M3 19l5.5-14L14 19M5 14h7"/><path d="M18 6v6M15 9h6"/>')}));
const bTxt=h('button',{type:'button',id:'bTxt','aria-label':'حجم خط النص','aria-expanded':'false',title:'حجم خط النص',onclick:e=>{e.stopPropagation();tPop.hidden=!tPop.hidden;bTxt.setAttribute('aria-expanded',String(!tPop.hidden))},html:ic('<path d="M3 18l4.5-11L12 18M4.6 14.5h5.8"/><path d="M14 18l3.5-8 3.5 8M15 15.5h5"/>')});
const sep=()=>h('i',{class:'bsep','aria-hidden':'true'});
bar.insertBefore(sep(),themeB);[zOut,zP,zIn,bTxt,b360].forEach(b=>bar.insertBefore(b,themeB));document.body.append(tPop);
document.addEventListener('pointerdown',e=>{if(!tPop.hidden&&!tPop.contains(e.target)&&!bTxt.contains(e.target)){tPop.hidden=true;bTxt.setAttribute('aria-expanded','false')}});
function paintZoom(){zP.querySelector('.zp').textContent=Math.round(100/zoomT)+'%';zIn.disabled=zoomT<=ZMIN+1e-3;zOut.disabled=zoomT>=ZMAX-1e-3;tPop.querySelector('.tp').textContent=Math.round(txt*100)+'%';tPop.querySelector('#tUp').disabled=txt>=1.4;tPop.querySelector('#tDn').disabled=txt<=.85}
document.documentElement.style.setProperty('--txt',txt);paintZoom();
document.addEventListener('keydown',e=>{const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;if(typeof sEl!=='undefined'&&sEl||typeof qEl!=='undefined'&&qEl)return;if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='+'||e.key==='='){setZoom(zoomT/1.25)}else if(e.key==='-'||e.key==='_'){setZoom(zoomT*1.25)}else if(e.key==='0'){setZoom(1);yawHome=true;panHome()}else if(e.key==='ArrowLeft'&&e.shiftKey){setPan(panT.x+.12,panT.y)}else if(e.key==='ArrowRight'&&e.shiftKey){setPan(panT.x-.12,panT.y)}else if(e.key==='r'||e.key==='R'){setSpin(!spin)}});

/* resize */
function resize(){const w=innerWidth,hh=innerHeight;renderer.setSize(w,hh,false);camera.aspect=w/hh;camera.fov=w<=760?46:34;
  const mobile=w<=760;const cw=card.offsetWidth,ch=card.offsetHeight;
  if(!mobile&&w>900)camera.setViewOffset(w,hh,Math.round(cw*.42),0,w,hh);else if(mobile)camera.setViewOffset(w,hh,0,Math.round(Math.min(ch,hh*.46)*.45),w,hh);else camera.clearViewOffset();
  camera.updateProjectionMatrix()}
addEventListener('resize',()=>{resize();setShot()});
new ResizeObserver(()=>resize()).observe(card);

/* loop */
const clock=new THREE.Clock();let shown=null;
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function frame(){const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  const k=reduce?1:1-Math.pow(.0016,dt);cam.p.lerp(target.p,k);cam.l.lerp(target.l,k);
  if(spin)yaw+=dt*.42;else if(yawHome){yaw=Math.atan2(Math.sin(yaw),Math.cos(yaw));yaw*=1-Math.min(1,dt*4);pitch*=1-Math.min(1,dt*4);if(Math.abs(yaw)<.002&&Math.abs(pitch)<.002){yaw=pitch=0;yawHome=false}}
  const off=cam.p.clone().sub(cam.l);const sph=new THREE.Spherical().setFromVector3(off);sph.theta+=yaw;sph.phi=Math.max(.15,Math.min(1.45,sph.phi-pitch));zoom+=(zoomT-zoom)*(reduce?1:Math.min(1,dt*9));sph.radius*=zoom;off.setFromSpherical(sph);
  pan.x+=(panT.x-pan.x)*(reduce?1:Math.min(1,dt*10));pan.y+=(panT.y-pan.y)*(reduce?1:Math.min(1,dt*10));const fw=off.clone().setY(0);if(fw.lengthSq()<1e-6)fw.set(0,0,1);fw.normalize().negate();const rt=new THREE.Vector3(-fw.z,0,fw.x);const tgt=cam.l.clone().addScaledVector(rt,pan.x).addScaledVector(fw,pan.y);panScale=sph.radius/Math.max(300,innerHeight)*1.15;camera.position.copy(tgt).add(off);camera.lookAt(tgt);
  // scenes rise/sink
  LESSONS.forEach((L,i)=>{const want=opened&&openT>=1&&i===li&&!(turning&&turning.t<.75);const s=L.group.scale.y;const tgt=want?1:.001;
    const ns=reduce?tgt:s+(tgt-s)*Math.min(1,dt*(want?5:9));L.group.scale.y=ns;L.group.visible=ns>.01;if(L.group.visible&&L.update)L.update(dt,t)});
  if(opened&&openT<1){openT=Math.min(1,openT+dt/(reduce?.01:1.6));setOpen(ease(openT))}
  if(turning){turning.t+=dt/(reduce?.01:1.15);const e=ease(Math.min(1,turning.t));bendFlip(turning.fwd?e:1-e,turning.fwd?-1:1);
    const gg=flip.userData.geo;// subtle curl
    if(turning.t>=1)finishTurn()}
  if(playing){playT+=dt;const b=beatsOf(LESSONS[li])[bi][0];const dur=b==='try'?14:b==='ex'?12:9;if(playT>dur){playT=0;next()}}
  renderer.render(scene,camera);requestAnimationFrame(frame)}

/* boot */
const bootStart=performance.now();
async function boot(){try{await Promise.race([Promise.all(['700 64px "Noto Sans Arabic"','400 33px Amiri','italic 400 34px Amiri','700 29px Amiri','500 26px "IBM Plex Sans Arabic"','600 40px "IBM Plex Sans Arabic"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  const m=/^#s(\d+)$/.exec(location.hash);const saved=parseInt(store('cap.l')||'0',10);li=m?Math.min(LESSONS.length-1,Math.max(0,+m[1]-1)):(isNaN(saved)?0:Math.min(LESSONS.length-1,saved));bi=0;
  drawCover();if(m){opened=true;openT=1}setOpen(opened?1:0);
  drawTextPage(cvR,LESSONS[li],li);drawScenePage(cvL,LESSONS[li],li);texR.needsUpdate=texL.needsUpdate=true;
  applyTheme();renderCard();resize();setShot();cam.p.set(0,3.4,3.2);cam.l.set(0,0,0);
  frame();const wait=Math.max(0,(reduce?600:5600)-(performance.now()-bootStart));const hide=()=>{const l=$('#loader');if(!l||l.classList.contains('out'))return;l.classList.add('out');setTimeout(()=>l.remove(),900)};setTimeout(hide,wait);$('#loader').addEventListener('click',hide)}
boot();
})();
</script>
